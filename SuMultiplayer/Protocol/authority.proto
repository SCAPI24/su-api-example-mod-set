syntax = "proto3";

package sump.authority;

option csharp_namespace = "SuMultiplayer.Protocol.Authority";
option optimize_for = SPEED;

import "google/protobuf/any.proto";

// Client -> host: ask the authority to apply one cell edit.
message CellEditRequest {
  int64 sequence = 1;
  int32 x = 2;
  int32 y = 3;
  int32 z = 4;
  int32 contents = 5;
  int32 data = 6;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: verdict for one request. contents/data are the authoritative
// values after the decision (rollback target when accepted == false).
message CellEditResult {
  int64 sequence = 1;
  bool accepted = 2;
  int32 x = 3;
  int32 y = 4;
  int32 z = 5;
  int32 contents = 6;
  int32 data = 7;
  string reason = 8;
  bool has_value = 9;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}
