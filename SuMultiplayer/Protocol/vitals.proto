syntax = "proto3";

package sump.vitals;

option csharp_namespace = "SuMultiplayer.Protocol.Vitals";
option optimize_for = SPEED;

import "google/protobuf/any.proto";

// ---------------------------------------------------------------------------
// Player vitals / health / death-state replication (audit finding F14/F7).
//
// WHO IS AUTHORITATIVE (2026-10 product decision: HOST-AUTHORITATIVE)
//   The **host** runs every character's health / vitals simulation:
//     * the host's own local characters (SubsystemPlayers.PlayersData, slots
//       0..3) are simulated by the host engine;
//     * every client character exists on the host as a network avatar
//       (client_id > 0, slot 0..3) and is simulated by the host engine too
//       (creatures / explosions / fall / drown / fire / magma / starvation /
//       sickness all apply there exactly as in single player).
//   The host sends the authoritative state **host -> client**:
//     * `PLAYER_VITALS_REPORT` = per-(client_id, slot) health / air / vitals /
//       flu / sickness / fire / sleeping / dead / cause, sent to the owner and
//       relayed to observing clients for pose / HUD;
//     * `PLAYER_VITALS_EVENTS` = death / respawn edges, decided by the host
//       (the host respawns a dead client avatar at its own spawn point).
//   A client **never** reports its own state.  It removes the local player's
//   ComponentHealth / ComponentVitalStats / ComponentSleep / ComponentFlu /
//   ComponentSickness / ComponentOnFire updateables and only writes the values
//   that arrive in this stream.  The host rejects (and counts) any inbound
//   client report / event: ids 95/96 are now host -> client only.  Their ids are
//   reused, append-only, and no existing id is renumbered.
//
// WIRE SEMANTICS
//   * Both messages are bounded and change driven (5 Hz on change, 1 Hz
//     heartbeat, immediately on a death / respawn edge or a rejoining client).
//   * `revision` is a per-(client_id, slot) monotonic version of the host's
//     authoritative state.  It only increases when the state changes or a
//     death / respawn edge happens, so a receiver can reject stale entries while
//     duplicated heartbeat entries (same revision) are simply ignored.
//   * `sequence` is the host's monotonic report / event message counter
//     (diagnostics + whole-message stale rejection on one TCP connection).
//   * (client_id, slot) is the stable PlayerKey (Players/PlayerKey.cs).
//     client_id = 0 is the host's own local slots; client_id > 0 identifies the
//     owning client's avatar.  The host writes both kinds in the same report so
//     the owner gets its own state and every observer gets pose / HUD state.
//
// Source: Mod/ScMultiplayer/Message/GamePlayerHealthMessage.cs:12-119
//         (the old health message field set that this compact report replaces)
// Source: Mod/ScMultiplayer/Modules/Player/ScMultiplayerPlayerHealthAndIngress.cs:40-100
//         (host authoritative health capture / send; clients only follow)
// Source: Mod/ScMultiplayer/Modules/Session/ScMultiplayerClientEvents.cs:3123-3260
//         (ResetNetworkPlayerAfterRespawn / ResetNetworkPlayerVitals: the engine
//          fields that must be restored on respawn)
// Source: Survivalcraft/Game/ComponentHealth.cs:ComponentHealth.Health/Air/DeathTime
// Source: Survivalcraft/Game/ComponentVitalStats.cs:ComponentVitalStats.Food/Stamina/
//         Sleep/Temperature/Wetness/m_satiation/m_targetTemperature
// Source: Survivalcraft/Game/ComponentFlu.cs:ComponentFlu.m_fluDuration/m_fluOnset
// Source: Survivalcraft/Game/ComponentSickness.cs:ComponentSickness.m_sicknessDuration
// Source: Survivalcraft/Game/ComponentOnFire.cs:ComponentOnFire.m_fireDuration
// Source: Survivalcraft/Game/ComponentHumanModel.cs:ComponentHumanModel.Update:86-94
//         (Health <= 0 or ComponentSleep.IsSleeping => lie-down pose)
// Source: Survivalcraft/Game/ComponentCreatureModel.cs:ComponentCreatureModel.Update:186-189
//         (DeathPhase rises while Health == 0)
// ---------------------------------------------------------------------------

// Position carried only by a respawn edge (authoritative spawn point chosen by the
// owner).  Defined locally so this file needs no cross-proto import; the ordinary
// position stream (position.proto) stays the only source of continuous motion.
message VitalsVec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// One ComponentVitalStats.m_satiation pair: block contents -> accumulated value.
// Bounded by PlayerVitalsLimits.MaxSatiationEntries (32) at encode / decode.
message PlayerSatiationEntry {
  uint32 contents = 1;
  float value = 2;
}

// The full owner-reported state of one character.  This is a **message** (not a
// set of scalar fields on the entry) so "values missing" is distinguishable from
// "all values are 0": an entry without `values` is rejected by the codec instead
// of being applied as a dead, starved character.
message PlayerVitalsValues {
  // 0..1; health == 0 is death (see `dead`).
  float health = 1;
  // 0..1 (ComponentHealth.Air / AirCapacity is engine-side and untouched).
  float air = 2;
  // 0..1.
  float food = 3;
  // 0..1.
  float stamina = 4;
  // 0..1.
  float sleep = 5;
  // 0..24 (engine clamps the property to this range).
  float temperature = 6;
  // 0..1.
  float wetness = 7;
  // ComponentVitalStats.m_targetTemperature (environment target; applied clamped 0..24).
  float target_temperature = 8;
  // Seconds remaining (ComponentFlu.m_fluDuration).
  float flu_duration = 9;
  // Seconds of cold exposure accumulated (ComponentFlu.m_fluOnset).
  float flu_onset = 10;
  // Seconds remaining (ComponentSickness.m_sicknessDuration).
  float sickness_duration = 11;
  // Seconds remaining (ComponentOnFire.m_fireDuration); 0 = extinguished.
  float fire_duration = 12;
  // ComponentSleep.IsSleeping (drives the lying pose while alive).
  bool sleeping = 13;
  // True iff health <= 0.  The codec rejects an entry where the two disagree.
  bool dead = 14;
  // ComponentHealth.CauseOfDeath at the moment of death (bounded to 64 chars).
  string cause_of_death = 15;
  repeated PlayerSatiationEntry satiation = 16;

  // ---- ComponentSleep presentation authority (append-only: 17..20) ----------
  //
  // The host runs the real ComponentSleep.Update for every simulated character
  // (host locals + client avatars).  The client removes its own
  // ComponentSleep.Update (`DisableLocalSimulation`), so all of the sleep
  // *presentation* that Update used to produce (blackout fade, Zzz, tap-to-wake /
  // unconscious hint, control hiding) must be driven from these authoritative
  // fields.  Source: Survivalcraft/Game/ComponentSleep.cs:104-164
  //
  // sleep_start_time = ComponentSleep.m_sleepStartTime (SubsystemGameInfo
  //   .TotalElapsedGameTime when Sleep() was called; 0 = not sleeping / unknown;
  //   the engine itself maps a persisted 0.0 back to null in Load()).
  // sleep_elapsed = (host TotalElapsedGameTime at capture) - sleep_start_time.
  //   This is **absolute from the sleep start**, so a client can keep advancing
  //   it with its own (host-synced) world clock between reports instead of
  //   depending on cross-device clock alignment.  It changes on every report and
  //   therefore does NOT count as a "meaningful change" for the report cadence.
  // allow_manual_wake = ComponentSleep.m_allowManualWakeUp.
  // forced_sleep = sleeping && !allow_manual_wake  (engine Sleep(false): the
  //   character fainted from lack of sleep / a sleep-causing effect and cannot
  //   tap to wake).  While awake it is always false.
  //
  // Older peers that do not know 17..20 send proto3 defaults, which decode as
  // "sleeping without sleep authority" (sleep_start_time = 0): the client still
  // shows the engine-equivalent Zzz / blackout fade but exposes no wake path and
  // counts `sleepLegacy` instead of inventing an episode length.
  double sleep_start_time = 17;
  float sleep_elapsed = 18;
  bool allow_manual_wake = 19;
  bool forced_sleep = 20;

  // ---- character level, host authoritative (append-only: 21) ----------------
  //
  // `PlayerData.Level` of the character this entry describes (`Survivalcraft/Game/
  // PlayerData.cs:118`).  The host runs the engine's own death path for every
  // simulated character, so the "level halves on death" rule
  // (`PlayerDead` enter: `Level = max(floor(Level / 2), 1)`, `PlayerData.cs:299`)
  // is executed **exactly once, on the host**, and the halved value is persisted
  // through the ordinary 5 s host record capture (`NetworkAvatarSpawner.
  // CapturePlayerRecord` already stores `Level`).  A client that also halves its
  // own PlayerData locally (the engine does that when *its* PlayerData enters
  // `PlayerDead`) is simply overwritten by this authoritative value, so the two
  // devices never end up halving twice in a row.
  //
  // Value semantics:
  //   * 1..1000   = the host's authoritative level (applied to the client's
  //                 `PlayerData.Level`, which is what `ComponentLevel` renders as
  //                 "Level N" and what `MeleeReplicaEngine` uses for tool gating);
  //   * 0         = "not carried" (an older host that does not know field 21).
  //                 A client must **not** write 0 into `PlayerData.Level`; it
  //                 counts `levelAbsent` instead (explicit, never a silent default).
  //   * negative / NaN / Inf / > 1000 = rejected by the codec (`levelRejected`).
  //
  // A **dead** entry is never written into the client's level (the local engine
  // is about to halve it; writing the already-halved host value first would make
  // the local halving happen on top of it).  The value is applied once the host
  // reports the character alive again (respawn), which is counted as
  // `levelRespawnOverrides` when it actually changes the new entity.
  float level = 21;

  // ---- host-authoritative freeze presentation (append-only: 22..23) --------
  //
  // Product decision 2026-10-21 (实机问题 1/2): the **host** owns the freeze
  // progress.  The client must not derive its ice overlay from its own copy of
  // the temperature (that value only arrives at 5 Hz and was applied as a step,
  // so the client's screen iced over ahead of the host's third-screen view and
  // the two devices disagreed about when the freeze happened).  The host
  // computes the progress from the **host-simulated** character (the same
  // Temperature that the engine writes IceFactor from) and sends it here; the
  // client only interpolates towards it (see PlayerFreezeInterpolator).
  //
  // freeze_progress = engine-equivalent ice overlay strength:
  //   Saturate(1 - Temperature / 6)   (Source: ComponentVitalStats.cs:579)
  //   0    = no ice overlay (Temperature >= 6) **or** a peer that predates
  //          this field (it sends proto3 defaults).  A receiver distinguishes
  //          the two through the authoritative `temperature`: when
  //          temperature < 6 and this field is 0 the field is absent -> the
  //          client counts `freezeLegacy` and derives the progress from the
  //          authoritative temperature (still a host value, never a local
  //          simulation).
  //   1    = fully iced (Temperature == 0 = engine "Froze to death").
  //
  // freeze_stage = the engine's cold thresholds as a stable enum value:
  //   0 = none (Temperature >= 8), 1 = chilly (< 8), 2 = cold (< 6),
  //   3 = hypothermia (< 3, engine injures 0.05 every 10 s), 4 = frozen
  //   (Temperature <= 0 -> engine Injure(1, "Froze to death")).
  // Source: Survivalcraft/Game/ComponentVitalStats.cs:UpdateTemperature:532-557,579
  //
  // Both fields are validated (progress 0..1 finite, stage 0..4, progress > 0
  // implies stage >= 2) and never clamped silently (PlayerVitalsSnapshot.
  // TryValidate).  Death itself stays host-authoritative through the existing
  // death edge / health field: the client never decides "I froze".
  float freeze_progress = 22;
  uint32 freeze_stage = 23;
}

message PlayerVitalsEntry {
  // Character owner: 0 = the host's own local slot, > 0 = that client's avatar.
  uint32 client_id = 1;
  // Local-character slot on that device (0..3).
  uint32 slot = 2;
  // Per-(client_id, slot) monotonic state version; 0 is invalid.
  uint32 revision = 3;
  PlayerVitalsValues values = 4;
}

// Host -> client authoritative state (the client never sends this message).
//   * entries with client_id = 0: the host's own local characters;
//   * entries with client_id > 0: that client's host-simulated avatar.
// The host sends the full current report to every player client: the owner sees
// its own rows, observers see everyone else's pose / HUD rows.
message PlayerVitalsReport {
  // Sender's monotonic report counter; 0 is invalid.
  uint32 sequence = 1;
  // Bounded by PlayerVitalsLimits.MaxReportEntries (24).
  repeated PlayerVitalsEntry entries = 2;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

enum PlayerVitalEventKind {
  PLAYER_VITAL_EVENT_KIND_UNSPECIFIED = 0;
  PLAYER_VITAL_EVENT_DEATH = 1;
  PLAYER_VITAL_EVENT_RESPAWN = 2;
}

// One edge event.  The event is sent **before** the report that carries the new
// revision, so a receiver applies the edge immediately (pose / death visual) and
// then applies the full values from the report.
message PlayerVitalEventEntry {
  uint32 client_id = 1;
  uint32 slot = 2;
  // Host state revision at the edge (> last applied revision of that key).
  uint32 revision = 3;
  PlayerVitalEventKind kind = 4;
  // Death: ComponentHealth.CauseOfDeath (bounded to 64 chars; may be empty).
  string cause_of_death = 5;
  // Respawn: the host-chosen spawn position; absent on death events.
  VitalsVec3 position = 6;
}

// Host -> client death / respawn edges, decided by the host and sent immediately
// (never delayed): the owner client shows death / follows the respawn position;
// observing clients update the avatar pose.
message PlayerVitalsEvents {
  uint32 sequence = 1;
  // Bounded by PlayerVitalsLimits.MaxReportEntries (24).
  repeated PlayerVitalEventEntry entries = 2;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: "I tapped while I was sleeping, wake me up".
//
// The host is the only authority on sleep (it runs the real ComponentSleep):
// it validates owner / still sleeping / manual wake allowed / elapsed > 10 s /
// not forced, calls the **engine** `ComponentSleep.WakeUp()` on its own copy of
// that character and then sends the updated authoritative report
// (sleeping = false), which fades the client's blackout out.  There is no
// separate result message by design: acceptance is observed through the same
// authoritative vitals report that already carries `sleeping`, and the host
// answers a rejected request with a rate-limited log + `sleepWakeReqRejectedBy`
// counter (the client gate never sends a request the engine rule would refuse).
//
// Append-only: message id PLAYER_WAKE_REQUEST = 103 (101 / 102 stay the respawn
// request / result).
message PlayerWakeRequest {
  // The requesting connection's client id; 0 is invalid (the host never asks).
  uint32 client_id = 1;
  // The sender's local-character slot (0..3).
  uint32 slot = 2;
  // Client's monotonic request counter (1..); diagnostics / log correlation.
  uint64 request_sequence = 3;
  // Client's estimate of the host sleep elapsed at the tap (seconds).  The host
  // **never trusts it** for the 10 s gate; it re-reads its own ComponentSleep.
  float sleep_elapsed = 4;
  // The sleep episode the client is asking to end (host game time at Sleep()).
  // Informational: lets the host log a mismatched episode.
  double sleep_start_time = 5;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: "I pressed the sleep button (or bed), put me to sleep".
//
// Why this message has to exist: the engine's only sleep entry is
// Survivalcraft/Game/ClothingWidget.cs:78-90, which runs on the peer that owns the
// widget.  On a client that is the client's own ComponentSleep — a component the
// host never reads and whose state the authoritative report overwrites with
// `sleeping = false` on the very next tick, which is exactly the observed
// "click sleep → lie down → instantly stand up".  The client therefore does not
// decide sleep at all: it asks, and the host decides.
//
// The host validates with its own `ComponentSleep.CanSleep(out reason)` (dry
// land / comfortable block / not too tired / not too wet / has shelter) and then
// calls the **engine** `Sleep(allowManualWakeup: true)` on its own copy of that
// character.  All wake paths stay on the host: satiety / daylight +180 s,
// HealthChange < 0, wetness, Attacked, and the >10 s manual tap
// (PLAYER_WAKE_REQUEST, id 103).
//
// Append-only: message ids PLAYER_SLEEP_REQUEST = 104 / PLAYER_SLEEP_RESULT = 105.
// Source: Survivalcraft/Game/ComponentSleep.cs:41-103（CanSleep / Sleep / WakeUp）
message PlayerSleepRequest {
  // The requesting connection's client id; 0 is invalid (the host never asks).
  uint32 client_id = 1;
  // The sender's local-character slot (0..3).
  uint32 slot = 2;
  // Client's monotonic request counter (1..); echoed in the result so the client
  // can drop a stale answer.
  uint64 request_sequence = 3;
  // True = the engine path that started this (`allowManualWakeup: true`, the sleep
  // button / bed).  Always true today; the field exists so a future forced / scripted
  // entry reuses the same message instead of inventing a second one.
  bool allow_manual_wake = 4;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

enum PlayerSleepResultKind {
  PLAYER_SLEEP_RESULT_KIND_UNSPECIFIED = 0;
  PLAYER_SLEEP_RESULT_KIND_ACCEPTED = 1;
  PLAYER_SLEEP_RESULT_KIND_REJECTED = 2;
}

// Host -> requesting client: the single verdict for one sleep request.
//
// Acceptance is *also* visible through the authoritative report (sleeping = true,
// with the host's sleep_start_time), which is what actually drives the pose /
// blackout / Zzz.  The explicit result exists so a rejection is explainable
// (`can-sleep:<engine reason>`) instead of the client silently not lying down.
message PlayerSleepResult {
  // Echo of the request identity.
  uint32 client_id = 1;
  uint32 slot = 2;
  uint64 request_sequence = 3;
  PlayerSleepResultKind kind = 4;
  // Stable reason code.  Accepted = "accepted"; rejected = one of
  // `wrong-owner`, `unknown-player`, `already-sleeping`, `dead`,
  // `can-sleep:<engine reason>`, `sleep-failed` (never a free-form sentence in the
  // code slot; the engine's own sentence is carried in `detail`).
  string reason = 5;
  // Human-readable detail for the client's HUD (the engine's CanSleep sentence).
  string detail = 6;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// ---------------------------------------------------------------------------
// Host-authoritative presentation effects (append-only).
//
// 实机问题 3/4（2026-10-21）：客户端本机角色的 ComponentFlu / ComponentSickness /
// ComponentOnFire 的 Update 在客户端被摘掉（`PlayerVitalsReplica.DisableLocalSimulation`，
// 客户端只跟随主机权威），于是主机模拟客户端化身时产生的 **咳嗽 / 打喷嚏 / 恶心呕吐 /
// 着火** 表现全部只在主机设备上出现：客户端只看到扣血（扣血本身由体征上报 95 下发），
// 没有咳嗽声、没有呕吐粒子、没有燃烧表现。旧联机 mod 也是这个症状（咳嗽只扣血）。
//
// 因此主机把**表现事件**单独下发（owner 客户端播放；扣血仍由 95 下发，绝不由本消息
// 改变生命 / 体征）：
//   * 主机每帧轮询它**自己模拟**的客户端化身（client_id > 0）的 ComponentFlu /
//     ComponentSickness / ComponentOnFire 私有计时字段，用**上升沿**识别一次新表现；
//   * 每条事件带 (client_id, slot, sequence) —— sequence 是每键单调序号，客户端按
//     (键, sequence) 去重（重复 / 过期事件计数后丢弃，绝不重复播放）；
//   * `kind` = 表现种类；`position` = 事件发生时化身的身体坐标（诊断 / 空间音频）；
//   * `sound` = 主机端该角色实际使用的**引擎资源名**（ComponentCreatureSounds 的
//     m_coughSound / m_sneezeSound / m_pukeSound / m_moanSound，或 ComponentOnFire 的
//     "Audio/SizzleLong"），客户端用引擎同款方法播放（资源名只用于核对 / 日志）；
//   * `host_time` = 主机 SubsystemGameInfo.TotalElapsedGameTime（客户端的游戏时钟由世界
//     信息持续对齐，所以客户端可以用它判过期：`PlayerEffectPolicy.TtlSeconds(kind)`）；
//   * `strength` = 表现强度（黑屏 / 绿屏时长秒数；着火 = 权威剩余火时长；熄灭 = 1 表示
//     被水浇灭 → 引擎会播 Audio/SizzleLong）。
//
// 方向：host -> client，**广播**给所有在线玩家端（observer 收到非自己键的事件时只计数
// `fluEffectNonOwner`，不播放 —— 本次修复范围是"客户端自己的化身"）。
// Append-only: 消息 id PLAYER_EFFECT_EVENTS = 109（当前最大 108 + 1），旧编号不变。
// Source: Survivalcraft/Game/ComponentFlu.cs:Cough/Sneeze/FluEffect
// Source: Survivalcraft/Game/ComponentSickness.cs:NauseaEffect
// Source: Survivalcraft/Game/ComponentOnFire.cs:Update（粒子 / Audio/SizzleLong）
// ---------------------------------------------------------------------------

enum PlayerEffectKind {
  PLAYER_EFFECT_KIND_UNSPECIFIED = 0;
  PLAYER_EFFECT_KIND_FLU_COUGH = 1;
  PLAYER_EFFECT_KIND_FLU_SNEEZE = 2;
  PLAYER_EFFECT_KIND_SICKNESS_NAUSEA = 3;
  PLAYER_EFFECT_KIND_SICKNESS_PUKE = 4;
  PLAYER_EFFECT_KIND_FIRE_IGNITE = 5;
  PLAYER_EFFECT_KIND_FIRE_EXTINGUISH = 6;
}

message PlayerEffectEventEntry {
  // Character owner: > 0 = that client's host-simulated avatar (the host never
  // sends its own local characters here: their presentation already runs on the
  // host and this fix is about the client's own avatar).
  uint32 client_id = 1;
  // Local-character slot on that device (0..3).
  uint32 slot = 2;
  // Per-(client_id, slot) monotonic presentation-event counter; 0 is invalid.
  // The client drops an event whose sequence is not newer than the last applied
  // one and counts it as a duplicate.
  uint32 sequence = 3;
  PlayerEffectKind kind = 4;
  // Body position at the moment of the effect (bounded to finite floats).
  VitalsVec3 position = 5;
  // Host TotalElapsedGameTime at the event (seconds; used for the staleness TTL).
  double host_time = 6;
  // Presentation strength (seconds of blackout / greenout exactly as the host
  // engine set them, remaining fire duration, 1 = water extinguish).
  // 0 = that effect carried no overlay this time (e.g. a cold sneeze has no
  // flu blackout; a direct Sneeze() call sets no blackout) -> the client must
  // NOT invent a default overlay, only play the sound / particles.
  float strength = 7;
  // Engine resource name actually used by the host character (bounded to 64).
  string sound = 8;
}

// Host -> all clients: presentation effects for host-simulated client avatars.
// Bounded by PlayerVitalsLimits.MaxEffectEntries (16) per message.
message PlayerEffectEvents {
  uint32 sequence = 1;
  repeated PlayerEffectEventEntry entries = 2;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}
