syntax = "proto3";

package sump.transfer;

option csharp_namespace = "SuMultiplayer.Protocol.Transfer";
option optimize_for = SPEED;

import "google/protobuf/any.proto";

// One Engine.Random field state. key = DeclaringType.FullName + "|" + fieldName.
message RandomStateEntry {
  string key = 1;
  int64 state = 2;
}

// The RNG table is repeated (not map) so the wire order stays deterministic.
message RandomStateTable {
  int32 seed = 1;
  repeated RandomStateEntry entries = 2;
}

// Host -> client: world manifest.
message WorldBegin {
  int32 transfer_id = 1;
  string world_name = 2;
  string directory_name = 3;
  int32 total_bytes = 4;
  int32 chunk_count = 5;
  int32 chunk_bytes = 6;
  string session_id = 7;
  int64 base_sequence = 8;
  RandomStateTable random = 9;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: one chunk of the pak.
message WorldChunk {
  int32 transfer_id = 1;
  int32 index = 2;
  int32 count = 3;
  int64 checksum = 4;
  bytes data = 5;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: transfer finished.
message WorldEnd {
  int32 transfer_id = 1;
  bool ok = 2;
  string reason = 3;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: request retransmission of these chunk indices.
message WorldMissing {
  int32 transfer_id = 1;
  repeated int32 indexes = 2;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}
