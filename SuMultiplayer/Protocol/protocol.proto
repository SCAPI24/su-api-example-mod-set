syntax = "proto3";

package sump.protocol;

option csharp_namespace = "SuMultiplayer.Protocol";
option optimize_for = SPEED;

import "google/protobuf/any.proto";

// ---------------------------------------------------------------------------
// MessageType is the compact id carried by the TCP frame header (uint16).
//
// Ranges:
//   0        reserved / invalid; a frame with type 0 is a protocol violation.
//   1..999   built-in SuMultiplayer messages (this enum).
//   1000..1999 third-party messages registered through MessageRegistry.
//
// The frame header still carries [length][sequence][type][flags]; the message
// itself is exactly the protobuf payload for that type.  Do not renumber an
// existing value: peers of different builds must agree on the id.
// ---------------------------------------------------------------------------
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;

  // Handshake / transport control (protocol.proto)
  HELLO = 1;
  HELLO_ACK = 2;
  INTEREST_UPDATE = 3;

  // Terrain synchronisation (terrain.proto)
  CHUNK_DIGEST_REPORT = 4;
  CHUNK_VERDICT = 5;
  CHUNK_RESYNC = 6;
  CELL_CHANGE = 7;

  // Reserved debug-control ids (kept stable; no payload is defined for them).
  DEBUG_SUBSCRIBE = 8;
  DEBUG_STATE = 9;

  BYE = 10;

  // World transfer (transfer.proto)
  WORLD_BEGIN = 11;
  WORLD_CHUNK = 12;
  WORLD_END = 13;
  WORLD_MISSING = 14;

  // Live map.  Payloads are intentionally NOT protobuf: the web page feed is a
  // frozen format (see Terrain/LiveMap.cs and doc/live-map.html).
  MAP_REQUEST = 15;
  MAP_STATE = 16;

  // Player positions (position.proto)
  PLAYER_POSITION = 17;
  PLAYER_POSITIONS = 18;

  // Client resident chunk set (terrain.proto)
  CLIENT_CHUNKS = 19;

  // Reconnect catch-up control (terrain.proto)
  CATCH_UP = 20;

  // Host -> client: re-verify these resident chunks (terrain.proto)
  VERIFY_CHUNKS = 21;

  // Creature replication (creature.proto)
  CREATURE_STATE = 22;
  CREATURE_RESYNC_REQUEST = 23;

  // Client cell edits (authority.proto)
  CELL_EDIT_REQUEST = 24;
  CELL_EDIT_RESULT = 25;

  // Host-authoritative world info (worldinfo.proto)
  WORLD_INFO = 26;

  // Player identity / appearance replication (this file).
  // Source: Mod/ScMultiplayer/Message/PlayerProfileMessage.cs:PlayerProfileMessage
  PLAYER_PROFILE = 27;
  AVATAR_REMOVE = 28;
  AVATAR_ROSTER = 29;

  // Player action / animation state / held item / inventory replication (action.proto).
  // Source: Mod/ScMultiplayer/Message/PlayerActionMessage.cs:PlayerActionMessage
  // Source: Mod/ScMultiplayer/Message/PlayerAimMessage.cs:PlayerAimMessage
  // Source: Mod/ScMultiplayer/Message/PlayerEquipmentMessage.cs:PlayerEquipmentMessage
  // Source: Mod/ScMultiplayer/Message/GamePlayerPositionMessage.cs:78-160
  //         （PokingPhase / AttackOrder / WalkOrder / JumpOrder / HandItem* / SlotValues 等字段）
  PLAYER_ACTION = 30;
  PLAYER_EQUIPMENT = 31;
  PLAYER_INVENTORY = 32;
  PLAYER_MOTION_STATE = 33;

  // Explosion replication (explosion.proto): host-authoritative, clients visual-only.
  EXPLOSION_EVENT = 34;
  EXPLOSION_REQUEST = 35;
  EXPLOSION_RESULT = 36;
  PLAYER_DAMAGED = 37;

  // Pickable (item drop) / projectile replication (entities.proto).
  // Host-authoritative lifecycle; clients only materialise replicas.
  // Source: Mod/ScMultiplayer/Message/PickableSyncMessage.cs:PickableSyncMessage
  // Source: Mod/ScMultiplayer/Message/ProjectileSyncMessage.cs:ProjectileSyncMessage
  ENTITY_STATE = 38;
  ENTITY_SNAPSHOT = 39;
  PICKABLE_ACQUIRE_REQUEST = 40;
  PICKABLE_ACQUIRE_RESULT = 41;
  ENTITY_RESYNC_REQUEST = 42;

  // Client-initiated item drop / throw / weapon fire (entities.proto).
  // Host validates and executes; the client never deducts locally before the
  // result and never creates pickables / projectiles by itself.
  // Source: Survivalcraft/Game/ComponentPlayer.cs:ComponentPlayer.Update (Drop)
  // Source: Survivalcraft/Game/SubsystemThrowableBlockBehavior.cs:OnAim
  // Source: Survivalcraft/Game/SubsystemBowBlockBehavior.cs:OnAim
  // Source: Survivalcraft/Game/SubsystemCrossbowBlockBehavior.cs:OnAim
  // Source: Survivalcraft/Game/SubsystemMusketBlockBehavior.cs:OnAim
  PICKABLE_DROP_REQUEST = 50;
  PICKABLE_DROP_RESULT = 51;
  PROJECTILE_FIRE_REQUEST = 52;
  PROJECTILE_FIRE_RESULT = 53;

  // Presentation-only weapon-fire sound relay (entities.proto):
  // host -> all clients after an accepted shot.  Append-only.
  WEAPON_FIRE_EVENT = 54;

  // Burn-away presentation (effects.proto): host-authoritative, clients only
  // spawn debris particles / play the sizzle sound.  Append-only.
  // Source: Survivalcraft/Game/SubsystemFireBlockBehavior.cs:227-256
  BURN_AWAY_EFFECT = 43;

  // Host-authoritative block use / interaction + container (block-entity) state.
  // Client -> host: "I clicked this block" (use request / close). The host validates
  // identity, distance, the block and its behaviour and performs the interaction.
  // Host -> client: result + authoritative ContainerState for the opened inventory.
  // Container edits are the UI's slot changes; the host applies them to the single
  // authoritative ComponentInventoryBase and broadcasts the resulting state.
  // Source: Survivalcraft/Game/SubsystemCraftingTableBlockBehavior.cs:OnInteract
  // Source: Survivalcraft/Game/SubsystemChestBlockBehavior.cs:OnInteract
  // Source: Survivalcraft/Game/SubsystemFurnaceBlockBehavior.cs:OnInteract
  // Source: Survivalcraft/Game/SubsystemDispenserBlockBehavior.cs:OnInteract
  // Source: Mod/ScMultiplayer/Modules/World/ScMultiplayerContainerHandlers.cs
  BLOCK_USE_REQUEST = 60;
  BLOCK_USE_RESULT = 61;
  CONTAINER_STATE = 62;
  CONTAINER_EDIT_REQUEST = 63;
  CONTAINER_EDIT_RESULT = 64;

  // MovingBlockSet motion presentation (piston.proto): host-authoritative, clients visual-only.
  // The engine represents the intermediate motion as MovingBlockSets that are NOT cell data,
  // so clients never see the moving head/rod (piston) or the falling sand/gravel column
  // (collapsing) until the final CellChange arrives.
  // Both kinds share these two messages; PistonMove.kind / PistonMoveEndEntry.kind select
  // PISTON or COLLAPSING (append-only field, 0 = older host that only knows pistons).
  // Append-only: 65 / 66 are new ids, no existing id is renumbered.
  // Source: Survivalcraft/Game/SubsystemPistonBlockBehavior.cs:MovePiston/StopPiston
  // Source: Survivalcraft/Game/SubsystemCollapsingBlockBehavior.cs:TryCollapseColumn/MovingBlocksStopped
  // Source: Survivalcraft/Game/SubsystemMovingBlocks.cs:AddMovingBlockSet/Update
  PISTON_MOVE_EVENT = 65;
  PISTON_MOVE_END = 66;

  // Campfire extinguish presentation (effects.proto): host -> all clients after a
  // burning campfire has burned out (cell stays campfire 209, data = 0).
  // Presentation-only: clients just play Audio/Sizzles at the cell; terrain still
  // arrives through the ordinary CellChange stream.  Append-only: 67 is a new id,
  // no existing id is renumbered.
  // Source: Survivalcraft/Game/SubsystemCampfireBlockBehavior.cs:ResizeCampfire
  CAMPFIRE_EXTINGUISH_EVENT = 67;

  // Remote action sound relay (remotesound.proto): presentation-only.
  // Host -> the requesting client and every other client within 48 m, after the
  // host executed that client's BlockUseRequest / container interaction.  The
  // block behaviours call SubsystemAudio locally on the host, so the requester
  // otherwise hears nothing (switch / button / lever / door / campfire / ...).
  // Append-only: 68 is a new id, no existing id is renumbered.
  // Source: Survivalcraft/Game/SwitchElectricElement.cs:27
  // Source: Survivalcraft/Game/SubsystemAudio.cs:98/112/118/124/138/144
  REMOTE_ACTION_SOUND = 68;

  // Pickup sound relay (entities.proto): presentation-only.
  // Host -> the requesting client (always) and every other client within a small
  // radius (16 m), right after the host accepted that client's
  // PickableAcquireRequest.  The host executes the acquire itself, so the
  // requesting client otherwise hears nothing at all (the presentation is not in
  // any state stream).  Append-only: 69 is a new id, no existing id is renumbered.
  // Source: Survivalcraft/Game/SubsystemPickables.cs:210-213
  //         (Audio/PickableCollected, volume 0.7, pitch -0.4, min distance 2)
  PICKUP_SOUND_EVENT = 69;

  // Host-authoritative furnace runtime state (blockuse.proto): the client's replica
  // ComponentFurnace has no simulation, so heat / smelting progress / fire time and the
  // lit block cell value arrive as state. Presentation-only on the client.
  // Append-only: 70 is a new id, no existing id is renumbered.
  // Source: Survivalcraft/Game/ComponentFurnace.cs:Update
  // Source: Survivalcraft/Game/FurnaceWidget.cs:Update
  FURNACE_STATE = 70;

  // Water splash presentation (effects.proto): presentation-only.
  // Host -> every client within 48 m of the splash position.  The engine creates
  // WaterSplashParticleSystem and plays Audio/Splashes locally on the host when a
  // pickable / projectile enters water; none of that is part of EntityState.
  // Clients recreate exactly the same particle system (and, when sound=true, the
  // same Audio/Splashes call) and never write cells / create entities / deal damage.
  // Append-only: 71 is a new id, no existing id is renumbered.
  // Source: Survivalcraft/Game/SubsystemPickables.cs:325-330
  // Source: Survivalcraft/Game/SubsystemProjectiles.cs:383-390
  // Source: Survivalcraft/Game/WaterSplashParticleSystem.cs:WaterSplashParticleSystem
  WATER_SPLASH_EVENT = 71;

  // Host-authoritative editable block content (editable.proto): the truth-table
  // circuit / memory-bank dialog commit.  The client sends the edited content +
  // the cell + the content its dialog started from; the host validates, applies
  // to the authoritative SubsystemEditableItemBehavior and broadcasts the
  // authoritative content back.  Presentation-only on the client.
  // Append-only: 72 / 73 / 74 are new ids, no existing id is renumbered.
  // Source: Survivalcraft/Game/SubsystemEditableItemBehavior.cs:23-39
  // Source: Survivalcraft/Game/SubsystemTruthTableCircuitBlockBehavior.cs:38-53
  // Source: Survivalcraft/Game/SubsystemMemoryBankBlockBehavior.cs:38-53
  // Source: Survivalcraft/Game/EditTruthTableDialog.cs / EditMemoryBankDialog.cs
  EDITABLE_EDIT_REQUEST = 72;
  EDITABLE_EDIT_RESULT = 73;
  EDITABLE_STATE = 74;

  // Custom player skin asset transfer (skin.proto): owner client -> host upload and
  // host -> other clients broadcast of a bounded, optionally compressed `.scskin`
  // asset. The host stores it world-scoped in the player record; clients only keep
  // a replica-scoped cache (never the global skin library / data:/CharacterSkins).
  // Append-only: 75/76 are new ids, no existing id is renumbered.
  PLAYER_SKIN_ASSET = 75;
  // Skin change notification / verdict (skin.proto): carries the new skin name and
  // hash plus the explicit reject / missing-asset reason.
  PLAYER_SKIN_CHANGED = 76;

  // Host-authoritative furniture design table + furniture inventory contents
  // (furniture.proto).  Client create/edit/paint requests are validated and
  // installed by the host into the world's SubsystemFurnitureBlockBehavior, then
  // broadcast as authoritative records.  Clients install them into a
  // replica-only, session-scoped store; their world save never contains those
  // designs.  Append-only: 77..81 are new ids, no existing id is renumbered.
  // Source: Survivalcraft/Game/SubsystemFurnitureBlockBehavior.cs:ScanDesign/Save
  // Source: Survivalcraft/Game/FurnitureBlock.cs:FurnitureBlock.Paint
  // Source: Survivalcraft/Game/ComponentFurnitureInventory.cs:FillSlots
  FURNITURE_DESIGN_REQUEST = 77;
  FURNITURE_DESIGN_RESULT = 78;
  FURNITURE_DESIGN_STATE = 79;
  FURNITURE_DESIGN_SYNC_REQUEST = 80;
  FURNITURE_CONTENT_STATE = 81;

  // Multiplayer chat (chat.proto), append-only: 82..84 are new ids, no
  // existing id is renumbered.
  // Client -> host request, host -> all clients accepted line, host -> sender
  // explicit rejection.  The host is the only broadcaster: a client never
  // sends CHAT_MESSAGE itself (see Protocol/chat.proto).
  // Source: Mod/ScMultiplayer/Message/ChatMessage.cs:ChatMessage
  CHAT_SEND_REQUEST = 82;
  CHAT_MESSAGE = 83;
  CHAT_REJECTED = 84;

  // Real-time voice chat (voice.proto): managed IMA ADPCM / CVSD, 8 kHz mono,
  // 40 ms packets, VAD gated, configurable quality profile (high/standard/low/
  // ultra; default low).  Every VoicePacket carries its format id.  A client
  // sends VOICE_PACKET only while talking; the host validates the negotiated
  // profile and relays to every other voice-capable listener that has not
  // muted that speaker.  Append-only: 85..90 are new ids, no existing id is
  // renumbered.
  // Source: Mod/SuMultiplayer/Voice/*.cs, Modules/VoiceChatModule.cs
  VOICE_PACKET = 85;
  VOICE_STATE = 86;
  VOICE_ROSTER = 87;
  VOICE_MUTE_REQUEST = 88;
  VOICE_MUTE_RESULT = 89;
  VOICE_CONTROL = 90;

  // Host-authoritative player statistics + achievements (stats.proto).
  // The host sends a chunked full snapshot to a joining / reconnecting client and
  // then deltas whenever its simulation changes an identity's [Stat] fields or
  // unlocks an achievement. Clients only apply these values for display; their own
  // engine-side stat writes are reverted (the host is the single authority).
  // Append-only: 91 / 92 are new ids, no existing id is renumbered.
  // Source: Survivalcraft/Game/SubsystemPlayerStats.cs:SubsystemPlayerStats
  // Source: Survivalcraft/Game/PlayerStats.cs:PlayerStats.Save/Load
  PLAYER_STATS_SNAPSHOT = 91;
  PLAYER_STATS_DELTA = 92;

  // Host -> client: looping ambient-bed volumes (Audio/Fire, Audio/Water,
  // Audio/Magma) computed by the host for *this* client's avatar position
  // (ambient.proto).  The loops are created by SubsystemAmbientSounds via
  // SubsystemAudio.CreateSound and never enter the queued-sound relay, so they
  // need their own small per-client state message.
  // Append-only: 93 is new, no existing id is renumbered.
  AMBIENT_SOUNDS_STATE = 93;

  // Multi-local-character roster (this file).  Client -> host: the complete list of
  // local characters (max 4) on that device, so the host can create one avatar per
  // (client_id, slot) and announce them to every client.  Sent after the handshake
  // and whenever the local set changes.  A peer that never sends it is a legacy
  // single-character peer (slot 0 only).  Append-only: 94 is new, no existing id is
  // renumbered.
  // Source: Survivalcraft/Game/SubsystemPlayers.cs:SubsystemPlayers.PlayersData
  LOCAL_PLAYER_SLOTS = 94;

  // Player vitals / health / death state (vitals.proto), audit finding F14/F7.
  // HOST-AUTHORITATIVE: the host simulates every character (its own local slots
  // and every host-side client avatar) and sends the authoritative state to the
  // owner client + relays it to observers (pose / HUD).  Clients never report
  // their own state; the host rejects and counts any inbound client report / event.
  // The host decides death / respawn.  Change driven (5 Hz on change, 1 Hz
  // heartbeat, immediately on death / respawn / rejoin).  Append-only: ids 95/96
  // are reused only by changing direction semantics to host -> client; no id is
  // renumbered and no new id was added.
  // Source: Survivalcraft/Game/ComponentHealth.cs:ComponentHealth.Health/Air/DeathTime
  // Source: Survivalcraft/Game/ComponentVitalStats.cs:ComponentVitalStats.Update
  // Source: Survivalcraft/Game/ComponentHumanModel.cs:ComponentHumanModel.Update:86-94
  // Source: Mod/ScMultiplayer/Message/GamePlayerHealthMessage.cs:12-119
  PLAYER_VITALS_REPORT = 95;
  PLAYER_VITALS_EVENTS = 96;

  // Host-authoritative melee attack (melee.proto).  Client -> host: "I attacked this
  // target (or the air), with this eye / look / reach".  Host -> attacker + observers:
  // the single melee verdict (hit / miss / reject reason, damage, target health after,
  // impact position + effect flags).  The client never rolls hit/miss and never applies
  // damage locally; it only presents an optimistic swing / impact and rolls it back
  // explicitly when the host result is a miss / reject.
  // Append-only: 97 / 98 are new ids, no existing id is renumbered.
  // Source: Survivalcraft/Game/ComponentMiner.cs:293（Hit：冷却 + 命中概率 + 伤害）
  // Source: Survivalcraft/Game/ComponentMiner.cs:472（AttackBody：护甲 / 韧性 / Injure / 击退）
  // Source: Survivalcraft/Game/ComponentMiner.cs:376（Raycast：reach + dot>0.7 + 遮挡）
  // Source: Survivalcraft/Game/ComponentPlayer.cs:230（原生攻击分支：BodyRaycast + 2 m + Hit）
  MELEE_ATTACK_REQUEST = 97;
  MELEE_ATTACK_RESULT = 98;

  // Shared combat random stream (melee.proto).  Host -> client: per-(clientId, slot)
  // session seed + current attack index.  Sent on join / reconnect and whenever the
  // client's own stream index must be resynchronised.  The client uses the same LCG
  // as the engine to predict hit / miss at attack time; the host remains the sole
  // authority for damage / HP and sends the actual rolls + damage in
  // MELEE_ATTACK_RESULT.  Append-only: 99 is a new id, no existing id is renumbered.
  // Source: Engine/Engine/Random.cs:13-58（LCG 常量 / Int / Bool / Float 语义）
  // Source: Survivalcraft/Game/ComponentMiner.cs:309-326（命中概率 / 伤害方差）
  COMBAT_RNG_SYNC = 99;

  // Client UI state mirroring (uistate.proto).  Client -> host: the client's
  // interface layer (input form / HUD visibility / active screen / open dialog /
  // open modal panel / chat input) so the host's split-screen view of that client
  // can show the same UI.  Change driven + heartbeat; read-only on the client.
  // Append-only: 100 was the reserved gap between 99 and 101; it is now a real
  // message id and no existing id is renumbered.
  // Source: Survivalcraft/Game/ComponentGui.cs:395（ControlsContainerWidget.IsVisible）
  // Source: Survivalcraft/Game/ComponentInput.cs:30（IsControlledByTouch）
  // Source: Survivalcraft/Game/ScreensManager.cs:46（CurrentScreen）
  // Source: Survivalcraft/Game/DialogsManager.cs:ShowDialog（dialog parent = GuiWidget）
  CLIENT_UI_STATE = 100;

  // Client-requested respawn after a host-decided death (respawn.proto).
  // The host never auto-respawns a dead client character: it sends the Death
  // edge and waits.  The client shows the engine-equivalent death screen and,
  // after the engine's 1.5 s guard, sends ONE request per death.  The host
  // validates owner + dead state + game-mode rules and answers with
  // PLAYER_RESPAWN_RESULT (id 102); accepting emits the existing RESPAWN event
  // (96) + authoritative report (95).
  // Append-only: 101 / 102 are new ids.  100 was the reserved gap and is now
  // CLIENT_UI_STATE (see above); no existing id is renumbered.
  // Source: Survivalcraft/Game/PlayerData.cs:275-330（死亡屏 / 1.5 s 点击门槛）
  // Source: Survivalcraft/Game/GameWidget.cs:63-80（每个 GameWidget 自己的 DeathCamera）
  PLAYER_RESPAWN_REQUEST = 101;
  PLAYER_RESPAWN_RESULT = 102;

  // Client-requested "tap to wake up early" while sleeping (vitals.proto).
  // The host is the only sleep authority (it runs the real ComponentSleep for every
  // character and sends `sleeping` in PLAYER_VITALS_REPORT).  A sleeping client shows
  // the engine-equivalent sleep screen from the authoritative sleep fields; a tap /
  // click / key after the engine's 10 s manual-wake gate sends ONE
  // PLAYER_WAKE_REQUEST (id 103) per sleep episode.  The host validates owner + still
  // sleeping + manual wake allowed + elapsed > 10 s + not forced, calls the engine
  // `ComponentSleep.WakeUp()` on its own copy, and the updated report
  // (sleeping = false) fades the client's blackout out.  There is no result message:
  // acceptance is observed through that same report, rejections are counted / logged
  // by the host (`sleepWakeReqRejectedBy`).
  // Append-only: 103 is a new id; 101 / 102 stay the respawn request / result and no
  // existing id is renumbered.
  // Source: Survivalcraft/Game/ComponentSleep.cs:96-164（WakeUp / 10 s 手动唤醒门槛 / 提示文本）
  PLAYER_WAKE_REQUEST = 103;

  // Client-requested sleep entry (vitals.proto): "I pressed the sleep button, put me
  // to sleep".  The host is the only sleep authority, but the engine's sleep entry
  // (Survivalcraft/Game/ClothingWidget.cs:78-90) runs on whichever peer owns the
  // widget — on a client that is the client's own ComponentSleep, which the host
  // never sees.  Without this request the client's local `Sleep()` is contradicted
  // by the very next authoritative report (sleeping = false), so the character
  // stands up immediately ("秒起").  The host re-validates with its own
  // `ComponentSleep.CanSleep()` and calls the **engine** `Sleep(allowManualWakeup:
  // true)` on its own copy of that character, then answers with
  // PLAYER_SLEEP_RESULT (id 105) and the authoritative report (sleeping = true).
  // Append-only: 104 / 105 are new ids; 101..103 keep their meaning.
  // Source: Survivalcraft/Game/ComponentSleep.cs:41-94（CanSleep / Sleep）
  // Source: Survivalcraft/Game/ClothingWidget.cs:78-90（sleep 按钮的唯一入口）
  PLAYER_SLEEP_REQUEST = 104;
  PLAYER_SLEEP_RESULT = 105;

  // Client-requested self-damage (selfdamage.proto): the "choke" button in the
  // character-info screen.  Survivalcraft/Game/VitalStatsWidget.cs:176-179 is a
  // PURELY LOCAL Injure — on a client that write is a prediction and the next
  // authoritative PLAYER_VITALS_REPORT (95) writes Health back, which is exactly
  // the observed "clicking the skull button does not lose health".  The client
  // therefore asks: the host validates owner / known player / alive / amount /
  // cooldown and calls the SAME engine
  // `ComponentHealth.Injure(amount, null, ignoreInvulnerability: true, "Choked")`
  // on its own copy of that character, then the existing vitals stream pushes the
  // new health back (an accepted request converges with the prediction; a rejected
  // one is rolled back by that same report).  Append-only: 106 / 107 are new ids;
  // no existing id is renumbered.
  // Source: Survivalcraft/Game/VitalStatsWidget.cs:176-179（骷髅按钮的唯一入口）
  // Source: Survivalcraft/Game/ComponentHealth.cs:74-136（Injure）
  PLAYER_SELF_DAMAGE_REQUEST = 106;
  PLAYER_SELF_DAMAGE_RESULT = 107;

  // Runtime player-profile report (playerprofile.proto): the Edit Players screen
  // writes PlayerData.Name / PlayerClass / CharacterSkinName locally, but the old
  // event-driven path (PLAYER_PROFILE = 27 + PlayerEditWatcher) only fires on a
  // ScreensManager.CurrentScreen transition.  A change that is not observed there
  // never reaches the host, so the host and every other client keep the old name
  // / skin ("改了没生效").  This message is the runtime change channel:
  //   client -> host : the client's own complete profile for one (clientId, slot)
  //   host -> clients: the authoritative profile after validation/apply
  // The host broadcast is sent to every player (including the changed client) and
  // carries a monotonic revision, so an older packet can never overwrite a newer
  // value.  Append-only: 108 = current max 107 + 1; no existing id is renumbered.
  // Source: Mod/ScMultiplayer/Modules/Player/ScMultiplayerProfileHandlers.cs:728-890
  PLAYER_PROFILE_SYNC = 108;

  // Host -> all clients: presentation effects of host-simulated client avatars
  // (vitals.proto PlayerEffectEvents).  The client removes its own
  // ComponentFlu / ComponentSickness / ComponentOnFire updateables so the host
  // is the only place those presentation effects are produced; the host polls
  // rising edges (cough / sneeze / nausea / puke / ignite / extinguish) on the
  // avatars it simulates and broadcasts them, and the owner client replays the
  // engine-equivalent sound / particle / overlay.  Health loss keeps arriving
  // through PLAYER_VITALS_REPORT (95); this message never changes vitals.
  // Append-only: 109 = current max 108 + 1; no existing id is renumbered.
  // Source: Survivalcraft/Game/ComponentFlu.cs:Cough/Sneeze/FluEffect
  // Source: Survivalcraft/Game/ComponentSickness.cs:NauseaEffect
  // Source: Survivalcraft/Game/ComponentOnFire.cs:Update
  PLAYER_EFFECT_EVENTS = 109;

  // Host -> every client whose interest window contains the hit: projectile hit
  // feedback (entities.proto ProjectileHitEvent).  Presentation only.  The
  // engine's "-N" HitValueParticleSystem lives inside ComponentMiner.AttackBody,
  // which a client replica never runs for projectiles (SuSubsystemProjectiles
  // skips base.Update on the replica), so without this event the shooter and
  // every other client see no damage number.  Clients only spawn the same
  // particle: never injure, never edit cells, never create entities.
  // Append-only: 111 = current max 109 + 1 (110 is retired); no id renumbered.
  // Source: Survivalcraft/Game/ComponentMiner.cs:506-526
  // Source: Survivalcraft/Game/SubsystemProjectiles.cs:221-240
  PROJECTILE_HIT_EVENT = 111;

  // 110 was the reverted respawn-progress handshake (respawn.proto
  // PlayerRespawnStage: client -> host preparing / spawned).  The host now
  // respawns immediately on PLAYER_RESPAWN_REQUEST, so the message is gone.
  // 110 is retired and must never be reused for a different message.
  reserved 110;

  // 世界控制（worldcontrol.proto）：客户端创意四按钮（降水/雾/闪电/时间）
  // 不在本地执行，发请求由主机在权威世界上落地；结果回执给请求者显示提示。
  // Append-only: new message ids 112/113, no existing id is renumbered.
  WORLD_CONTROL_REQUEST = 112;
  WORLD_CONTROL_RESULT = 113;
}

// Logical envelope metadata.  The current single-message transport puts these
// fields in the 16-byte TCP frame header, so the envelope message is not sent
// on the wire today; it exists so batching / future transports share one
// schema.  Never wrap MapState in it (the live-map payload is frozen).
message Envelope {
  uint32 protocol_version = 1;
  uint64 sequence = 2;
  MessageType type = 3;
  uint32 flags = 4;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: first frame on a connection.
// One "I already have this character record" claim (client -> host, in Hello).
// record_key = PlayerIdentity.RecordKey(identity, name, slot); hash = the record_hash
// published by the host earlier (0 = unknown, never sent). The host compares it with its
// current record hash and only re-sends the records that actually changed.
// Append-only: new message, no existing message is renumbered.
message KnownRecordHash {
  string record_key = 1;
  uint64 hash = 2;
}

message Hello {
  // ClientKind: 0 = player, 1 = debug observer.
  uint32 kind = 1;
  string name = 2;
  uint32 protocol_version = 3;
  uint32 protocol_revision = 4;
  // Interest radius in chunks (clamped by the host).
  int32 radius = 5;
  // Stable player identity (UserId.dat). Empty when the engine cannot provide it.
  string identity = 6;
  // True when this client is currently playing the downloaded world for this room.
  bool already_has_world = 7;
  string client_session_id = 8;
  int64 last_applied_sequence = 9;
  // The joining player's own profile (display name + sex + skin + clothes).
  // Empty on the very first join: the host answers with profile_required=true and
  // the client opens the character creation screen (legacy SCMP_PROFILE_REQUIRED).
  // Source: Mod/ScMultiplayer/Message/GameWorldInfoMessage.cs:PlayerName/HasPlayerProfile/
  //         PlayerClass/CharacterSkinName
  PlayerProfile profile = 10;
  // Character records this client already holds locally (from the downloaded world pak,
  // i.e. <world>/SuMultiplayerPlayers.xml it imported earlier). The host diffs them against
  // its current per-record hashes and only re-sends the changed records on rejoin.
  // Empty = first join / old client => full backfill (no behavior change).
  repeated KnownRecordHash known_records = 11;

  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: handshake answer.
message HelloAck {
  uint32 version = 1;
  int32 client_id = 2;
  string room = 3;
  uint32 flags = 4;
  int32 max_radius = 5;
  string host_identity = 6;
  string host_name = 7;
  string session_id = 8;
  bool rejoin_accepted = 9;
  int64 head_sequence = 10;
  string rejoin_reason = 11;
  // The host's own profile: clients create the host avatar with the real name / sex / skin.
  // Source: Mod/ScMultiplayer/Modules/Player/ScMultiplayerProfileHandlers.cs:728-767
  //         (SynchronizePlayerProfiles: host sends CapturePlayerRecord(hostPlayer.PlayerData))
  PlayerProfile host_profile = 12;
  // The host's authoritative record for the joining client (name / sex / skin / clothes).
  // Empty while profile_required=true (no record exists yet).
  PlayerProfile assigned_profile = 13;
  // true => the host has no character record for this identity and the Hello carried no
  // complete profile. The host does NOT start the world transfer; the client must open the
  // character creation screen and reconnect with Hello.profile filled in.
  // Source: Mod/ScMultiplayer/Modules/Player/ScMultiplayerPlayerHealthAndIngress.cs:945-961
  bool profile_required = 14;
  // Explicit reason for profile_required (logged by the client; empty for old hosts).
  string profile_required_reason = 15;
  // true => the host already stores the custom skin asset for this identity's
  // assigned_profile (world-scoped player record), so the client must NOT re-upload
  // it; the host sends it proactively. false/old host => the client uploads its own
  // asset right after the handshake (first join / repair).
  bool assigned_skin_asset_present = 16;
  // true => the host declined this join (manual host approval): no world transfer is
  // started and the client must abort the join and show reject_reason.
  // Source: Mod/ScMultiplayer (join approval: Allow/Reject or auto-approve setting)
  bool rejected = 17;
  // Explicit reject reason (logged / shown by the client; empty = host did not explain).
  string reject_reason = 18;

  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Engine appearance inputs of one player:
//   sex        = Game.PlayerClass (PlayerData.PlayerClass)
//   skin_name  = PlayerData.CharacterSkinName (built-in "$Male3" / custom file name)
//   clothes    = ComponentClothing slots 0..3 (ClothingSlot values)
//   skin_sha256= hash of a custom skin asset (empty for built-in skins)
// Source: Survivalcraft/Game/PlayerData.cs:PlayerData.PlayerClass/CharacterSkinName
// Source: Survivalcraft/Game/ComponentClothing.cs:ComponentClothing.GetClothes/SetClothes
message PlayerAppearance {
  uint32 sex = 1;
  string skin_name = 2;
  repeated ClothingSlot clothes = 3;
  bytes skin_sha256 = 4;
}

// One ComponentClothing slot (the engine stores an int[] per ClothingSlot).
message ClothingSlot {
  repeated int32 values = 1;
}

// Host <-> client: one player's identity + appearance.
// Client -> host: the client's own profile (client_id = its local transport id or 0).
// Host -> clients: broadcast for the host (client_id = 0) and for every joined client
// (client_id = the host-side transport id, which is also the remote avatar slot key).
// Source: Mod/ScMultiplayer/Modules/Player/ScMultiplayerProfileHandlers.cs:763-849
//         (HandlePlayerProfileMessage: host updates its record/avatar and broadcasts;
//          clients apply to the local player or the remote avatar)
message PlayerProfile {
  int32 client_id = 1;
  string identity = 2;
  string name = 3;
  PlayerAppearance appearance = 4;
  bool is_host = 5;
  bool has_character = 6;
  // Local-character slot on that device (0..3). Append-only: absent / 0 = legacy
  // single-character peer (the old wire format is byte-identical because proto3
  // omits the default value). (client_id, slot) is the stable player key.
  // Source: Mod/SuMultiplayer/Players/PlayerKey.cs
  uint32 slot = 7;
  // Per-character record hash (the "does not change often" subset of the player
  // record: name / class / skin (incl. custom asset hash) / clothes / inventory /
  // level). Stored in SuMultiplayerPlayers.xml (never in Project.xml) and carried by
  // the world pak, so a rejoining client can diff which character records changed and
  // only the changed ones are re-sent. Append-only: 0 / absent = old host or unknown
  // (clients must then treat the record as changed).
  // Source: Mod/SuMultiplayer/Players/PlayerRecordHash.cs
  uint64 record_hash = 8;
}

// Host -> clients: this identity left the room (its remote avatar must be removed).
message AvatarRemove {
  int32 client_id = 1;
  string identity = 2;
  string reason = 3;
  // Local-character slot (0..3); absent / 0 = legacy single-character peer.
  uint32 slot = 4;
}

// One local character announced by a client (client -> host).
message LocalPlayerSlot {
  // Slot 0..3. Invalid values are a protocol violation (host rejects the message).
  uint32 slot = 1;
  // The character's own identity + appearance (name / sex / skin / clothes).
  PlayerProfile profile = 2;
  // Engine PlayerIndex of the local PlayerData (diagnostics only; never an identity).
  int32 local_player_index = 3;
}

// Client -> host: the **complete** list of local characters this device currently plays.
// Sent once after the handshake and re-sent whenever the local set / a profile changes
// (a split-screen player is added or removed). A peer that never sends it is treated as a
// legacy single-character peer (slot 0 only), so old clients keep working unchanged.
// Append-only: new message id 94, no existing id is renumbered.
// Source: Survivalcraft/Game/SubsystemPlayers.cs:SubsystemPlayers.PlayersData (max 4 local players)
message LocalPlayerSlots {
  // Number of valid entries (must equal entries.size; 1..4).
  uint32 count = 1;
  repeated LocalPlayerSlot slots = 2;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> clients: the **complete** current identity roster (host at client_id=0 + every
// joined client). Clients replace their roster with exactly this list, so a reconnect or a
// missed leave message can never leave a ghost avatar behind.
message AvatarRoster {
  repeated PlayerProfile avatars = 1;
}

// Client -> host: interest window centre (chunk coordinates) and radius.
message InterestUpdate {
  int32 center_x = 1;
  int32 center_z = 2;
  int32 radius = 3;

  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: leaving the room.
message Bye {
  string reason = 1;

  bytes ext = 100;
  google.protobuf.Any custom = 101;
}
