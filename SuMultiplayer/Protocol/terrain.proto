syntax = "proto3";

package sump.terrain;

option csharp_namespace = "SuMultiplayer.Protocol.Terrain";
option optimize_for = SPEED;

import "google/protobuf/any.proto";

// Chunk coordinates (x/z are chunk indices, not cell coordinates).
message ChunkKey {
  sint32 x = 1;
  sint32 z = 2;
}

// One cell edit: cell coordinates are chunk-local for CellChange/ChunkResync and
// world coordinates for CellEditRequest/CellEditResult (authority.proto).
message CellEdit {
  sint32 x = 1;
  int32 y = 2;
  sint32 z = 3;
  int32 contents = 4;
  int32 data = 5;
}

// Verdict values mirror Terrain.DigestVerdict (0/1/2 on the old wire).
enum ChunkDigestVerdict {
  CHUNK_DIGEST_VERDICT_NOT_READY = 0;
  CHUNK_DIGEST_VERDICT_MATCH = 1;
  CHUNK_DIGEST_VERDICT_MISMATCH = 2;
}

// Client -> host: one or more chunk digest reports.
message ChunkDigestReport {
  message Entry {
    ChunkKey key = 1;
    uint32 hash = 2;
    // 客户端算这块摘要时的地形改动序号（TerrainSyncClient 的 m_lastAppliedChangeSequence）。
    // 主机据此判断"客户端是否已经收到这块到某水位为止的全部改动"：
    // 客户端序号 < 主机该块序号 ⇒ 客户端内容**本来就旧**，应回 NOT_READY 而不是 MISMATCH。
    // 见 doc/chunk-digest-tiered-verify-plan.md 第 5 章第 6 步。
    int64 client_change_sequence = 3;
    // 客户端算摘要时的引擎阶段（ChunkContentStages 序数）：让主机区分
    // "内容没定稿"与"内容不一致"。0 = 未提供（旧客户端 / 测试桩）。
    uint32 client_engine_stage = 4;
    // 客户端算出的**顶层摘要**（16×16 = 256 个顶格；见 ChunkDigest.ComputeTopLayer）。
    // 主机判 Mismatch 时**必须**靠它判断"差异是否只在顶层"：
    //   · 客户端顶层 hash != 主机顶层 hash ⇒ 差异确实在顶层 → 发 TOP_LAYER_FIX（256 格，< 1ms）；
    //   · 相同 ⇒ 差异在深处（草/流体/树…）→ **直接整块回传**，绝不能发顶层补丁。
    // 没有这两个字段时主机会盲发顶层补丁，而补顶层对深处差异毫无作用 →
    // 客户端整块摘要仍不同 → 重报 → 无限循环（实机实测：每秒 101 次上报、Match 0、回传 0 片）。
    uint32 client_top_height_hash = 5;
    uint32 client_top_block_hash = 6;
  }
  repeated Entry entries = 1;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: digest verdicts.
message ChunkVerdict {
  message Entry {
    ChunkKey key = 1;
    ChunkDigestVerdict verdict = 2;
    uint32 host_hash = 3;
    // 主机裁决时该块的地形改动序号。客户端可据此确认"主机看到的是最新内容"，
    // 以及诊断"这条 Mismatch 是不是迟到的裁决"。0 = 未提供。
    int64 host_change_sequence = 4;
  }
  repeated Entry entries = 1;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: 顶层摘要（16×16 = 256 个顶格）与主机不一致，请求差异格。
//
// 只在 chunk 加载时发送（与 ChunkDigestReport 同一时机）。主机按这两个 hash
// 判断是否真的不一致，然后只回 TOP_LAYER_FIX 的差异格 —— 不发整块快照。
//
// 见 doc/chunk-digest-tiered-verify-plan.md 第 4.5 节。
message TopLayerMismatchReport {
  ChunkKey key = 1;
  // 256 列 topHeight 的 FNV-1a 摘要（ChunkDigest.TopHeightHash）。
  uint32 client_top_height_hash = 2;
  // 256 列顶格 (contents,data) 的 FNV-1a 摘要（ChunkDigest.TopBlockHash）。
  uint32 client_top_block_hash = 3;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: 只下发**顶层那一层**里两端不同的格子。
//
// cells 用 chunk-local 坐标（x/z 0..15，y 是绝对高度），复用 CellEdit。
// 客户端用与 CellChange 同一套落地逻辑（TerrainBridge.ApplyCells）。
//
// 主机同时回自己的两个顶层 hash，客户端落地后可直接确认是否收敛 ——
// 不收敛说明"差异不只在顶层"，由客户端升级为整块 ChunkResync 请求。
//
// 见 doc/chunk-digest-tiered-verify-plan.md 第 4.5 节。
message TopLayerFix {
  ChunkKey key = 1;
  repeated CellEdit cells = 2;
  uint32 host_top_height_hash = 3;
  uint32 host_top_block_hash = 4;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: one whole-chunk snapshot part.
//
// "records" is a compact array of fixed 8-byte runs; entries * 8 == records.size.
// A run is: uint8 x, uint8 z, uint8 start_y, uint8 length_minus_one,
//           int32 packed (little endian, packed = (contents << 16) | data).
// The array is deliberately opaque bytes: one chunk can contain 65k cells and
// per-cell protobuf entries would multiply the frame size.
message ChunkResync {
  ChunkKey key = 1;
  int32 index = 2;
  int32 count = 3;
  int32 entries = 4;
  bytes records = 5;
  // Change journal sequence captured when this snapshot was encoded (absent = unknown).
  optional int64 watermark = 6;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: one or more authoritative cell changes.
message CellChange {
  message Entry {
    ChunkKey key = 1;
    CellEdit edit = 2;
  }
  repeated Entry entries = 1;
  // Parallel to entries: journal sequence of each change (empty = unknown).
  repeated int64 sequences = 2;
  // bit0 = replay (catch-up), bit1..31 reserved.
  uint32 flags = 3;
  // Per-connection delivery stream. index = prev_index + 1; -1 = unknown.
  int64 prev_delivery_index = 4;
  int64 delivery_index = 5;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Reconnect catch-up stages (Request/Applied are client -> host, the rest host -> client).
enum CatchUpPhase {
  CATCH_UP_PHASE_REQUEST = 0;
  CATCH_UP_PHASE_BEGIN = 1;
  CATCH_UP_PHASE_BARRIER = 2;
  CATCH_UP_PHASE_REJECTED = 3;
  CATCH_UP_PHASE_APPLIED = 4;
}

message CatchUp {
  CatchUpPhase phase = 1;
  int64 last_applied = 2;
  int64 head = 3;
  int64 first_retained = 4;
  int32 change_count = 5;
  string reason = 6;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: resident chunk set (full-set part or load/unload delta).
enum ChunkSetMode {
  CHUNK_SET_MODE_DELTA = 0;
  CHUNK_SET_MODE_FULL_SET = 1;
}

message ClientChunks {
  message Entry {
    sint32 x = 1;
    sint32 z = 2;
    bool loaded = 3;
  }
  ChunkSetMode mode = 1;
  int32 full_set_id = 2;
  int32 part_index = 3;
  int32 part_count = 4;
  repeated Entry entries = 5;
  // Payload revision (currently 1). A mismatch is rejected explicitly.
  uint32 version = 6;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: re-verify chunks (an empty list means "all resident chunks").
message VerifyChunks {
  repeated ChunkKey chunks = 1;
  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host on the secondary circuit socket. The ticket is issued by the
// host only after the primary player handshake and is single-use.
message CircuitAttach {
  int32 primary_client_id = 1;
  bytes ticket = 2;
}

// Host -> client on the secondary circuit socket. The transport consumes this
// frame before exposing circuit payloads to the circuit module.
message CircuitAttached {
  int32 primary_client_id = 1;
  bool accepted = 2;
  string reason = 3;
}

message CircuitTicketRequest {
  uint64 request_id = 1;
}

message CircuitTicketResponse {
  uint64 request_id = 1;
  bytes ticket = 2;
  string error = 3;
}
