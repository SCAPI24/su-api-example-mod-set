syntax = "proto3";

package sump.effects;

option csharp_namespace = "SuMultiplayer.Protocol.Effects";
option optimize_for = SPEED;

import "google/protobuf/any.proto";
import "position.proto";

// ---------------------------------------------------------------------------
// Burn-away presentation replication (host-authoritative; clients are
// presentation-only).
//
// Wire id lives in protocol.proto (MessageType.BURN_AWAY_EFFECT=43).  It is
// append-only: never renumber.
//
// Engine fact (Survivalcraft/Game/SubsystemFireBlockBehavior.cs:227-256):
// every 5 game seconds the host consumes m_toBurnAway, replaces each queued
// block with air, then spawns BurntDebrisParticleSystem (at most 15 within
// 24 m of the nearest view) and plays Audio/Sizzles (at most 4 within 16 m).
// None of that is part of the terrain stream, so clients currently see the
// block disappear without any debris / sizzle.
//
// This message carries exactly that presentation batch:
//   * one message per host burn-away batch (all cells coalesced);
//   * cells are world coordinates;
//   * sizzle = the host considers this cell eligible for the sizzle sound
//     (currently every burned cell).  Each client still applies its own
//     24 m debris / 16 m sound distance rule and the 15 / 4 per-batch caps,
//     matching the engine's per-view experience.
//
// Clients must NEVER write cells, spawn entities or deal damage for this
// message.  Terrain changes still arrive through the ordinary CellChange
// stream.
// ---------------------------------------------------------------------------

// One burned-away cell (world coordinates).
message CellKey {
  sint32 x = 1;
  sint32 y = 2;
  sint32 z = 3;
  // true = eligible for Audio/Sizzles when within 16 m of the local player.
  bool sizzle = 4;
}

// Host -> client: one burn-away batch.
message BurnAwayEffect {
  // Host-side transport id; 0 = the host itself (the only producer today).
  int32 client_id = 1;
  // Host simulation clock in milliseconds (SubsystemGameInfo.TotalElapsedGameTime*1000).
  int64 server_tick = 2;
  // All cells that burned away in this batch (coalesced, host-capped).
  repeated CellKey cells = 3;
  // Host session sequence, starts at 1, strictly increasing.  Clients dedupe by it.
  uint32 event_id = 4;

  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// ---------------------------------------------------------------------------
// Campfire extinguish presentation (host-authoritative; clients presentation-only).
//
// Wire id lives in protocol.proto (MessageType.CAMPFIRE_EXTINGUISH_EVENT=67).
// Append-only: never renumber.
//
// Engine fact (Survivalcraft/Game/SubsystemCampfireBlockBehavior.cs):
//   * a campfire is the same block (209) with fuel in its data nibble;
//   * the host Update ticks fuel down every 5 game seconds and, when data reaches 0,
//     ChangeCell keeps contents 209 (ashes) and ResizeCampfire plays Audio/Sizzles;
//   * that sound is local to the host and is NOT part of the CellChange stream.
//
// This message carries exactly one already-finished extinguish:
//   * cell = world coordinates of the campfire that is now data = 0;
//   * clients only play Audio/Sizzles at that cell (rate limited); they never write
//     cells, spawn entities or deal damage.
// ---------------------------------------------------------------------------

// Host -> client: one campfire finished burning.
message CampfireExtinguishEvent {
  // Host-side transport id; 0 = the host itself (the only producer today).
  int32 client_id = 1;
  // Host simulation clock in milliseconds (SubsystemGameInfo.TotalElapsedGameTime*1000).
  int64 server_tick = 2;
  // Host session sequence, starts at 1, strictly increasing.  Clients dedupe by it.
  uint32 event_id = 3;
  // World coordinates of the campfire cell (contents 209, data 0).
  sint32 x = 4;
  sint32 y = 5;
  sint32 z = 6;

  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// ---------------------------------------------------------------------------
// Water splash presentation (host-authoritative; clients presentation-only).
//
// Wire id lives in protocol.proto (MessageType.WATER_SPLASH_EVENT=71).
// Append-only: never renumber.
//
// Engine fact:
//   * SubsystemPickables.Update, per pickable in water with !SplashGenerated:
//       AddParticleSystem(new WaterSplashParticleSystem(terrain, pickable.Position,
//           large: false));
//       PlayRandomSound("Audio/Splashes", 1f, random(-0.2, 0.2), pickable.Position,
//           6f, autoDelay: true);
//       pickable.SplashGenerated = true;
//     (Source: Survivalcraft/Game/SubsystemPickables.cs:325-330)
//   * SubsystemProjectiles.Update, when a projectile enters water:
//       AddParticleSystem(new WaterSplashParticleSystem(terrain,
//           new Vector3(projectile.Position.X, surfaceHeight, projectile.Position.Z),
//           large: false));
//       PlayRandomSound("Audio/Splashes", 1f, random(-0.2, 0.2), projectile.Position,
//           6f, autoDelay: true);
//     (Source: Survivalcraft/Game/SubsystemProjectiles.cs:383-390)
//
// This message carries exactly the host's already-created splashes:
//   * one batch per host tick, capped at WaterSplashPolicy.MaxSplashesPerEvent;
//   * position / large are the constructor arguments of the host particle system;
//   * sound = the host also queued the engine's Audio/Splashes call.  Clients
//     replay the same directory / volume / pitch range / min distance / autoDelay.
// Clients must NEVER write cells, spawn entities or deal damage for this message.
// ---------------------------------------------------------------------------

// One host water splash.
message WaterSplash {
  sump.position.Vec3 position = 1;
  // WaterSplashParticleSystem(terrain, position, large).  All current host call
  // sites pass large: false (engine facts above); carried so a future large call
  // cannot silently render small on clients.
  bool large = 2;
  // true = the host also played Audio/Splashes for this splash.
  bool sound = 3;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> client: one batched set of splashes from the same host tick.
message WaterSplashEvent {
  // Host simulation clock in milliseconds (SubsystemGameInfo.TotalElapsedGameTime*1000).
  int64 server_tick_ms = 1;
  // Host session sequence, starts at 1, strictly increasing.  Clients dedupe by it.
  uint32 event_id = 2;
  // 1 .. WaterSplashPolicy.MaxSplashesPerEvent.
  repeated WaterSplash splashes = 3;

  bytes ext = 100;
  google.protobuf.Any custom = 101;
}
