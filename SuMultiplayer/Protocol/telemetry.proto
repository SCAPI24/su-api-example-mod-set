syntax = "proto3";

package sump.telemetry;

option csharp_namespace = "SuMultiplayer.Protocol.Telemetry";
option optimize_for = SPEED;

message RuntimeSample {
  uint64 sampled_at_ms = 1;
  bool cpu_available = 2;
  float cpu_one_core_percent = 3;
  float cpu_total_percent = 4;
  uint32 processor_count = 5;
  float game_update_hz = 6;
  float frame_time_avg_ms = 7;
  float frame_time_max_ms = 8;
  repeated ModuleTickSample modules = 9;
  uint32 module_sample_every = 10;
}

message ModuleTickSample {
  string id = 1;
  uint64 calls = 2;
  float total_ms = 3;
  float max_ms = 4;
}

message CircuitStageSample {
  string id = 1;
  uint64 calls = 2;
  float total_ms = 3;
  float max_ms = 4;
  float last_ms = 5;
  uint64 slow_calls = 6;
  string max_context = 7;
}

message MessageTypeTraffic {
  uint32 type_id = 1;
  string name = 2;
  uint64 frames_sent = 3;
  uint64 bytes_sent = 4;
  uint64 frames_received = 5;
  uint64 bytes_received = 6;
}

message ChannelSample {
  string state = 1;
  uint64 frames_sent = 2;
  uint64 bytes_sent = 3;
  uint64 frames_received = 4;
  uint64 bytes_received = 5;
  uint64 backpressure_events = 6;
  uint64 protocol_violations = 7;
  uint64 send_queue_high = 8;
  repeated MessageTypeTraffic message_types = 9;
}

message PeerSample {
  int32 client_id = 1;
  string key = 2;
  string name = 3;
  RuntimeSample client_runtime = 4;
  uint64 runtime_age_ms = 5;
  ChannelSample primary = 6;
  ChannelSample circuit = 7;
  ClientCircuitSample client_circuit = 8;
  TerrainResyncSample terrain_resync = 9;
  uint64 terrain_resync_age_ms = 10;
  // 该玩家端自报的地形同步计数（含顶层摘要校验效果 / 第 6/8 步拦截量）。
  // 客户端侧没有 host 的 resyncBytes 等字段，那些留 0（不伪造）。
  TerrainSyncSample terrain = 11;
}

message CircuitSyncSample {
  uint64 rounds = 1;
  uint64 attached_peers = 2;
  uint64 scope_chunks = 3;
  uint64 seven_segment_states = 4;
  uint64 snapshot_chunks = 5;
  uint64 snapshot_elements = 6;
  uint64 snapshot_parts = 7;
  uint64 delta_states = 8;
  uint64 send_failures = 9;
  uint64 client_scope_requests = 10;
  uint64 client_scope_chunks = 11;
  uint64 client_snapshot_parts = 12;
  uint64 client_snapshots_applied = 13;
  uint64 client_states_applied = 14;
  uint64 client_apply_failures = 15;
  uint64 client_hash_reports = 16;
  uint64 client_hash_chunks = 17;
  uint64 client_watermark_expired = 18;
  bool client_simulation_enabled = 19;
  uint64 host_sync_window_calls = 20;
  float host_sync_window_ms = 21;
  float host_sync_window_max_ms = 22;
  uint64 hash_mismatches_observed = 23;
  uint64 hash_repair_chunks_queued = 24;
  uint64 repair_ack_hash_mismatches = 25;
  uint64 repair_ack_chunks_queued = 26;
  uint64 snapshot_request_chunks = 27;
  uint64 needs_full_snapshot_chunks_queued = 28;
  uint64 snapshots_initial_scope = 29;
  uint64 snapshots_hash_repair = 30;
  uint64 snapshots_repair_ack_repair = 31;
  uint64 snapshots_client_request = 32;
  uint64 snapshots_needs_full_recovery = 33;
  uint64 snapshots_pause_barrier = 34;
  uint64 snapshots_topology_change = 35;
  uint64 snapshots_send_failure_recovery = 36;
  uint64 snapshot_send_failures = 37;
  uint64 host_batch_capture_failures = 38;
  uint64 requested_snapshot_capture_failures = 39;
  uint64 host_batch_capture_chunks_failed = 40;
  repeated CircuitStageSample stages = 41;
}

message ClientCircuitSample {
  uint64 hash_capture_failures = 1;
  uint64 hash_capture_chunks_skipped = 2;
  uint64 hash_reports_sent = 3;
  uint64 hash_chunks_sent = 4;
  uint64 scope_requests_sent = 5;
  uint64 scope_request_chunks_sent = 6;
  uint64 snapshot_parts_received = 7;
  uint64 snapshots_applied = 8;
  uint64 states_applied = 9;
  uint64 apply_failures = 10;
  uint64 watermark_expired = 11;
  uint64 snapshot_timeouts = 12;
  repeated CircuitStageSample stages = 13;
  // ---- 电路暂停优化（客户端移动加载 chunk 时不再停模拟）----
  // 客户端「scope 响应在途但仍沿用旧 scope 继续模拟」的进入次数。
  uint64 stale_scope_reuse = 14;
  // 客户端此刻是否真的在推进电路模拟（false = 被暂停；对照下面的 pending 可定位原因）。
  bool simulation_enabled = 15;
  // 客户端是否在等「全电路范围同 step 快照」（true 时会暂停）。
  bool full_scope_snapshot_pending = 16;
}

// Host-scheduled, short-lived client diagnostic window for terrain resync.
message TerrainResyncSample {
  uint64 request_id = 1;
  uint32 window_ms = 2;
  uint64 shard_bytes = 3;
  uint64 rle_runs = 4;
  uint64 expanded_cells = 5;
  float decode_ms = 6;
  float apply_ms = 7;
  float circuit_callback_ms = 8;
  float final_digest_ms = 9;
  uint64 applied_parts = 10;
  uint64 no_pending_six_face_rollbacks = 11;
  float no_pending_six_face_rollback_ms = 12;
  uint64 chunk_load_events = 13;
  uint64 chunk_unload_events = 14;
  uint64 hash_checks = 15;
  uint64 hash_matches = 16;
  uint64 hash_mismatches = 17;
  float hash_ms = 18;
  float hash_max_ms = 19;
  uint64 resync_changed_cells = 20;
  uint64 resync_unchanged_cells = 21;
  uint64 terrain_invalidations = 22;
}

message TerrainSyncSample {
  uint64 digest_reports = 1;
  uint64 cell_changes_broadcast = 2;
  uint64 cell_change_repairs = 3;
  uint64 resync_bytes = 4;
  uint64 reports_per_second = 5;
  uint64 mismatch_per_second = 6;
  uint64 resync_received_per_second = 7;
  uint64 resync_applied_per_second = 8;
  uint64 verify_requests_sent = 9;
  uint64 verify_request_send_failures = 10;
  uint32 pending_reports = 11;
  uint32 pending_marks = 12;
  uint32 pending_clients = 13;
  uint64 resync_runs = 14;
  uint64 resync_expanded_cells = 15;
  float resync_encode_ms = 16;
  uint64 resync_shard_bytes = 17;
  uint64 owed_snapshots_queued = 18;
  uint64 owed_snapshots_skipped_no_content = 19;

  // ---- 顶层摘要校验（16×16 = 256 格；见 doc/chunk-digest-tiered-verify-plan.md）----
  // 客户端把"整块回传"降级为"只补顶层差异格"的效果，全部可观测。
  uint64 top_layer_checks = 20;
  uint64 top_layer_matches = 21;
  uint64 top_layer_reports_sent = 22;
  uint64 top_layer_fixes_received = 23;
  uint64 top_layer_fix_cells_applied = 24;
  uint64 top_layer_fix_escalations = 25;
  uint64 top_layer_unavailable = 26;

  // ---- 第 6/8 步：内容未定稿 / 迟到的裁决（都不再触发整块回传）----
  uint64 digests_deferred_not_stable = 27;
  uint64 verdicts_stale_skipped = 28;

  // ---- 主机侧：Mismatch 走顶层补丁（而不是整块回传）----
  // 这是"缺块 → NotReady → 按需加载 → 顶层比对 → 只补顶层"这条链路的直接证据。
  uint64 top_layer_fix_from_mismatch = 29;
  uint64 top_layer_fixes_sent = 30;
  uint64 top_layer_fix_send_failures = 31;

  // ---- 收敛闭环（修"灰框永久残留"）----
  // 顶层补丁已收敛、但块不在内存集合导致没能回摘要的次数。
  uint64 top_layer_converge_unreported = 32;
  // 卡在"不一致"超时后被自愈（强制退回未核对 + 重新上报）的块次数。
  uint64 stale_healed = 33;
  // Mismatch 但顶层并不不同（差异在深处）→ 改走整块回传的次数。
  // 不为 0 是正常的（草/流体/树/火焰类差异）；暴涨说明客户端顶层 hash 有问题。
  uint64 top_layer_fix_skipped_not_top_layer = 34;

  // ---- clientHash == 0（语义是"客户端未知"，不是"不一致"）----
  // 主机：收到 0 并改判 NotReady 的次数（改判前是误判成红框 + 整块回传）。
  uint64 client_hash_zero_verdicts = 35;
  // 客户端：算出 / 缓存到 0 因而**没发出去**的次数（不发 0 → 不再被主机误判）。
  uint64 client_hash_zero_skipped = 36;
  // 客户端：发送时因内容未定稿而延后的上报条数（不发 0，下一帧重试）。
  uint64 reports_deferred_not_stable = 37;
  // 客户端没带顶层 hash → 主机无法判断差异位置、保守走整块的次数。**应为 0**；
  // 不为 0 说明客户端有路径没刷新顶层 hash（就是"红框那一刻卡一下"的根因）。
  uint64 top_layer_fix_skipped_no_client_hash = 38;

  // ---- 树叶段补丁（季节驱动的树叶季相；见 doc/leaves-layer-resync-plan.md）----
  // 主机：观察到「树叶季相真实写入 chunk」并打标记的次数（按目标客户端展开前）。
  uint64 leaves_marked = 39;
  // 主机：打了标记但当时没有任何「在线且未持有该块」的客户端（不需要补）。
  uint64 leaves_marked_unroutable = 40;
  // 主机：入队的树叶段补丁作业数。
  uint64 leaves_only_jobs = 41;
  // 主机：树叶段补丁累计游程数。
  uint64 leaves_only_runs = 42;
  // 主机：树叶段补丁累计字节；÷ jobs 应与实测单块 224~3400 字节同量级。
  uint64 leaves_only_bytes = 43;
  // 主机：带树叶标记但编码出 0 游程 → 改走整块回传的次数。应接近 0。
  uint64 leaves_zero_run_fallback = 44;
  // 主机：客户端没带顶层 hash → 回 NotReady（树叶段也不发）的次数。启动后应很快归 0。
  uint64 leaves_recalc_deferred = 45;
  // 主机：顶层一致而未发顶层修复、只补了树叶段的次数。
  uint64 leaves_top_layer_skipped = 46;
  // 主机：树叶段补丁发完后的顶层修复发送失败次数（显式背压）。
  uint64 leaves_fix_send_failures = 47;
  // 主机：当前在册的（区块 × 身份）树叶季相标记条数。
  uint64 leaves_pending_marks = 48;
  // 客户端：树叶段补丁落地次数（末片落地算一次）。
  uint64 leaves_fix_applied = 49;
  // 客户端：树叶段补丁累计落地格数。
  uint64 leaves_fix_cells = 50;
  // 客户端：顶层补丁落地时清掉的「主机顶格之上的残留」格数。
  // 融雪/化冰后客户端留着一层雪就是这类；这个数一旦增长，说明旧行为下红框会永不收敛。
  uint64 top_layer_trimmed_cells = 51;
  // 客户端：引擎未实现裁剪通道、顶层补丁退化为「只写不清」的次数（应为 0）。
  uint64 top_layer_trim_unavailable = 52;
  // 主机：同一块连续顶层补丁达上限（3 次）→ 改走整块回传的次数。
  uint64 top_layer_fix_attempt_exceeded = 53;
}

message LiveTelemetry {
  uint64 sample_id = 1;
  uint64 sampled_at_ms = 2;
  RuntimeSample host_runtime = 3;
  CircuitSyncSample circuit = 4;
  TerrainSyncSample terrain = 5;
  repeated PeerSample peers = 6;
  float live_map_build_ms = 7;
  uint32 live_map_chunks = 8;
  uint32 live_map_batches = 9;
  uint64 live_map_bytes_sent = 10;
  uint64 live_map_frames_sent = 11;
  uint64 live_map_requests = 12;
  ChannelSample monitor_transport = 13;
}

// Client -> host: low-rate local process and game-update performance sample.
message ClientRuntimeTelemetry {
  RuntimeSample runtime = 1;
  ClientCircuitSample circuit = 2;
  // 客户端自己的地形同步计数（原来只在客户端本地，主机看不到）。
  // 顶层摘要校验的效果 + 第 6/8 步的拦截量都必须在这里才到得了 LiveMap：
  // 主机侧不做顶层校验（m_topLayerChecks 在 TerrainSyncClient 里），
  // 所以 TerrainSyncSample 里那 9 个字段对主机恒为 0。
  // 见 doc/chunk-digest-tiered-verify-plan.md。
  TerrainSyncSample terrain = 3;
}

// Host -> client: capture terrain resync diagnostics for a bounded window.
message TerrainDiagnosticControl {
  uint64 request_id = 1;
  uint32 window_ms = 2;
}

// Client -> host: one sample requested by TerrainDiagnosticControl.
message TerrainDiagnosticReport {
  TerrainResyncSample sample = 1;
}
