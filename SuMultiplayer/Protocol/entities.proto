syntax = "proto3";

package sump.entities;

option csharp_namespace = "SuMultiplayer.Protocol.Entities";
option optimize_for = SPEED;

import "google/protobuf/any.proto";
import "position.proto";

// ---------------------------------------------------------------------------
// Pickable (item drop) / projectile replication.
//
// Authority split (same shape as terrain / creatures / explosions):
//   * host   : the ONLY side that creates, simulates, acquires and removes
//              SubsystemPickables.Pickables / SubsystemProjectiles.Projectiles;
//   * client : never runs acquisition and never spawns these by itself.  It
//              only materialises the replicas described here so they render.
//
// Wire ids live in protocol.proto (append-only):
//   ENTITY_STATE = 38, ENTITY_SNAPSHOT = 39,
//   PICKABLE_ACQUIRE_REQUEST = 40, PICKABLE_ACQUIRE_RESULT = 41,
//   ENTITY_RESYNC_REQUEST = 42.
//
// Source: Mod/ScMultiplayer/Message/PickableSyncMessage.cs:PickableSyncMessage
// Source: Mod/ScMultiplayer/Message/ProjectileSyncMessage.cs:ProjectileSyncMessage
// Source: Mod/ScMultiplayer/Modules/Entity/ScMultiplayerPickableProjectileHandlers.cs
//         (Create / UpdatePosition / Delete / Acquire / RequestAcquire)
// ---------------------------------------------------------------------------

// Lifecycle edge carried by one record.
//   ADD    = the host just created this object (replica must be created);
//   UPDATE = value/count/position/velocity/... changed (coalesced, change driven);
//   REMOVE = the host object no longer exists (picked up / burned / expired /
//            projectiles hit and converted).  Clients remove the replica.
enum EntityAction {
  ENTITY_ACTION_ADD = 0;
  ENTITY_ACTION_UPDATE = 1;
  ENTITY_ACTION_REMOVE = 2;
}

// One host pickable (SubsystemPickables.Pickables entry).
//
// Source: Survivalcraft/Game/SubsystemPickables.cs:SubsystemPickables.AddPickable
// Source: Survivalcraft/Game/Pickable.cs:Pickable.Count/FlyToPosition/StuckMatrix
message PickableState {
  // Host-assigned network id, unique per host session and per entity kind.
  // 0 is invalid (never sent).
  int32 id = 1;
  EntityAction action = 2;
  // Full engine block value (contents + data), e.g. block-break drop.
  int32 value = 3;
  // Remaining stack count. 0 is only valid on REMOVE.
  int32 count = 4;
  sump.position.Vec3 position = 5;
  sump.position.Vec3 velocity = 6;
  // Pickables have no free rotation; a projectile that stuck in a block is
  // converted into a pickable with a rigid StuckMatrix (translation+rotation).
  // Source: Survivalcraft/Game/SubsystemProjectiles.cs:CalculateVelocityAlignMatrix
  bool has_stuck_matrix = 7;
  sump.position.Vec3 stuck_position = 8;
  sump.position.Quat stuck_rotation = 9;
  // Host-side magnetic pull (native pickup animation). Clients only mirror it.
  bool has_fly_to = 10;
  sump.position.Vec3 fly_to = 11;
  // REMOVE only: which player collected it (host transport id, -1 = unknown /
  // not a pickup). Presentation hint; removal itself is already authoritative.
  int32 collector_client_id = 12;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// One host projectile (SubsystemProjectiles.Projectiles entry).
//
// Source: Survivalcraft/Game/SubsystemProjectiles.cs:SubsystemProjectiles.AddProjectile
// Source: Survivalcraft/Game/Projectile.cs:Projectile.Value/Position/Velocity/
//         Rotation/AngularVelocity/TrailOffset/IsIncendiary
message ProjectileState {
  int32 id = 1;
  EntityAction action = 2;
  int32 value = 3;
  sump.position.Vec3 position = 4;
  sump.position.Vec3 velocity = 5;
  // Axis-angle rotation (engine Projectile.Rotation).
  sump.position.Vec3 rotation = 6;
  sump.position.Vec3 angular_velocity = 7;
  // Owner player (host transport id; -1 = no player owner / world projectile).
  int32 owner_client_id = 8;
  // true = the projectile has come to rest (velocity nearly zero); clients may
  // stop extrapolating.  Lifecycle is still decided by the host.
  bool stuck = 9;
  bool incendiary = 10;
  sump.position.Vec3 trail_offset = 11;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> clients: one coalesced, change-driven incremental batch.
message EntityState {
  // Host session sequence, starts at 1, strictly increasing.  Clients dedupe /
  // reject stale batches by it (same pattern as ExplosionEvent.event_id).
  uint32 version = 1;
  // Host simulation clock in milliseconds (SubsystemGameInfo.TotalElapsedGameTime*1000).
  int64 server_tick = 2;
  repeated PickableState pickables = 3;
  repeated ProjectileState projectiles = 4;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> one client: complete snapshot for join / reconnect / resync.
//
// The host sends this on ClientJoined (best effort; the client may not have a
// world yet) and whenever a client sends EntityResyncRequest (authoritative
// restore path).  A client that receives a snapshot with complete=true replaces
// its replica set with exactly these records, so a reconnect can never leave a
// duplicate or a ghost replica behind.
message EntitySnapshot {
  uint32 snapshot_id = 1;
  int64 server_tick = 2;
  repeated PickableState pickables = 3;
  repeated ProjectileState projectiles = 4;
  // false = the host truncated the snapshot (bounded record count).  Clients
  // must then keep existing replicas that are absent from this message.
  bool complete = 5;
  // Host EntityState version at snapshot build time.  A snapshot built before
  // an incremental state that this client already applied is stale: applying
  // its complete=true removal set would delete replicas added by the newer
  // state (and the host never re-sends ADD for them).  0 = old host.
  uint32 state_version = 6;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// One sparse inventory slot change (same semantics as the player-inventory
// delta in action.proto; duplicated here so this domain stays self-contained).
message InventorySlotDelta {
  int32 index = 1;
  int32 value = 2;
  int32 count = 3;
}

// Client -> host: "I want to pick up this replica".
// Source: Mod/ScMultiplayer/Message/PickableSyncMessage.cs:PickAction.RequestAcquire
message PickableAcquireRequest {
  // Per-connection request sequence, starts at 1, strictly increasing.
  int64 sequence = 1;
  // Host-assigned pickable network id from EntityState / EntitySnapshot.
  int32 pickable_id = 2;
  // The client's pickup target (its eye position) for diagnostics only.
  // The host validates against its OWN authoritative avatar position, never
  // against this claim.
  sump.position.Vec3 position = 3;
  // Requester's effective interaction reach (metres): engine ComponentMiner.Raycast
  // uses Creative ? SettingsManager.CreativeReach : 5f.  Host rule:
  // allowed = min(reach + tolerance, serverMax); absent (old client) = 5.0 / 7.5.
  // Source: Survivalcraft/Game/ComponentMiner.cs:378
  optional float reach = 4;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> collector: verdict for one PickableAcquireRequest.
//
// The removal itself is broadcast through EntityState(REMOVE) to every client
// (including the collector); this result only carries the collector's private
// inventory delta.  A rejected request always carries an explicit reason.
message PickableAcquireResult {
  int64 sequence = 1;
  int32 pickable_id = 2;
  bool accepted = 3;
  // Explicit rejection reason ("not-player-peer", "unknown-pickable",
  // "creation-grace", "distance", "inventory-full", ...). Empty when accepted.
  string reason = 4;
  // Remaining stack count after the acquisition (0 = fully consumed).
  int32 remaining_count = 5;
  // true = the host pickable was fully consumed and removed.
  bool removed = 6;
  // Sparse authoritative inventory delta for the collector.
  repeated InventorySlotDelta inventory = 7;
  // Host inventory version (monotonic; diagnostics / ordering hint).
  int32 inventory_version = 8;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Client -> host: "my world is ready / I missed updates: send a full snapshot".
// Hosts answer with EntitySnapshot; the same path is used after a reconnect.
message EntityResyncRequest {
  string reason = 1;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// ---------------------------------------------------------------------------
// Client-initiated item drop / throw / weapon fire (host requests).
//
// Authority split (client = presentation only):
//   * client UI drop (Q / gamepad B / inventory drop) must NOT remove the item
//     from the local inventory and must NOT call AddPickable.  The engine drop
//     branch (ComponentPlayer.Update) is suppressed by the injected input shell;
//     the client sends PickableDropRequest and waits for the host verdict.
//   * client throw / bow / crossbow / musket fire must NOT call FireProjectile,
//     must NOT consume the item and must NOT damage durability.  The block
//     behaviour shells send ProjectileFireRequest instead.
//   * host validates (identity / slot content vs its authoritative inventory /
//     distance / item legality), mutates its authoritative avatar inventory,
//     spawns the pickable / projectile with the engine's own API, persists the
//     avatar inventory and broadcasts the entity through EntityState /
//     EntitySnapshot (32 Hz change driven).  The requester also gets one sparse
//     inventory delta so the local mirror converges without a local deduction.
//
// Wire ids live in protocol.proto (append-only, reserved 50..53):
//   PICKABLE_DROP_REQUEST = 50, PICKABLE_DROP_RESULT = 51,
//   PROJECTILE_FIRE_REQUEST = 52, PROJECTILE_FIRE_RESULT = 53.
// ---------------------------------------------------------------------------

// Where one client drop request came from.  Both values are player intents
// executed by the host; they differ in count semantics and spawn velocity.
//   0 / DROP_SOURCE_INPUT (default, legacy): keyboard / gamepad PlayerInput.Drop.
//       The engine drops the whole active slot (8 m/s along the eye direction).
//   1 / DROP_SOURCE_UI: inventory drag-to-world (ViewWidget.DragDrop).
//       Remove exactly `count` items from `active_slot` (the drag can carry a
//       single item / the whole stack) and toss at 12 m/s along the drag
//       direction (which is NOT tied to the avatar's eye rotation).
enum DropSource {
  DROP_SOURCE_INPUT = 0;
  DROP_SOURCE_UI = 1;
}

// Client -> host: "drop items from this inventory slot".
//
// Source: Survivalcraft/Game/ComponentPlayer.cs:ComponentPlayer.Update
//         （playerInput.Drop → RemoveSlotItems(active, count) → SubsystemPickables.AddPickable）
// Source: Survivalcraft/Game/ViewWidget.cs:ViewWidget.DragDrop
//         （inventory drag onto the world → RemoveSlotItems(slot, count) → AddPickable）
message PickableDropRequest {
  // Per-connection request sequence, starts at 1, strictly increasing.
  int64 sequence = 1;
  // Inventory slot the drop came from.  INPUT always drops the active slot;
  // UI can drop from any player-inventory slot the drag started in.
  int32 active_slot = 2;
  // Item value (contents + data) the client believes it is dropping.  The host
  // requires a contents match against its authoritative inventory slot; a stale
  // mirror is rejected explicitly ("slot-mismatch") instead of guessing.
  int32 item_value = 3;
  // Number of items the client is dropping.  INPUT: diagnostics only (the host
  // drops its authoritative whole slot).  UI: **authoritative removal count** —
  // the host requires count ∈ [1, authoritative slot count] and removes exactly
  // this many items (drag single item / split stack).
  int32 count = 4;
  // Client drop origin (diagnostics; the host spawns at its own avatar).
  sump.position.Vec3 position = 5;
  // Normalized drop direction.  INPUT: the eye direction (the host re-derives
  // it from its authoritative avatar and only checks consistency).  UI: the
  // drag ray direction (the host uses it as-is at 12 m/s; there is no
  // eye-rotation equivalent for a UI drag).
  sump.position.Vec3 direction = 6;
  // Request kind; see DropSource.  Unset (0) = legacy keyboard/gamepad drop.
  DropSource source = 11;
  // Requester's effective interaction reach (same semantics as PickableAcquireRequest.reach).
  optional float reach = 12;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> requester: verdict for one PickableDropRequest.
//
// The pickable itself is broadcast to every client through EntityState(ADD);
// this result only carries the requester's private sparse inventory delta.
// A rejected request never loses an item on either side, and the reason is
// always explicit ("not-player-peer", "no-avatar", "slot-range", "empty-slot",
// "slot-mismatch", "active-slot-changed", "distance", "direction-invalid",
// "item-illegal", "remove-refused", "spawn-failed", ...).
message PickableDropResult {
  int64 sequence = 1;
  bool accepted = 2;
  string reason = 3;
  // Authoritative item dropped (value + count); zero when rejected.
  int32 item_value = 4;
  int32 count = 5;
  // Authoritative spawn position / velocity (zero when rejected).
  sump.position.Vec3 position = 6;
  sump.position.Vec3 velocity = 7;
  // Sparse authoritative inventory delta for the requester.
  repeated InventorySlotDelta inventory = 8;
  int32 inventory_version = 9;
  // Host-assigned entity-replication id of the created pickable.  The client
  // uses it to materialise its replica immediately from this authoritative
  // result (the EntityState(ADD) that follows is then just an update).  0 =
  // not provided (old host): the client waits for the state stream instead.
  int32 pickable_id = 10;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Which engine path spawned the projectile(s).
enum ProjectileFireKind {
  PROJECTILE_FIRE_KIND_UNSPECIFIED = 0;
  // SubsystemThrowableBlockBehavior: spear / snowball / stone chunk / egg / brick ...
  PROJECTILE_FIRE_KIND_THROWABLE = 1;
  // SubsystemBowBlockBehavior (one arrow, speed from draw).
  PROJECTILE_FIRE_KIND_BOW = 2;
  // SubsystemCrossbowBlockBehavior (one bolt, only when fully drawn).
  PROJECTILE_FIRE_KIND_CROSSBOW = 3;
  // SubsystemMusketBlockBehavior (musket ball / buckshot spread / blank shot).
  PROJECTILE_FIRE_KIND_MUSKET = 4;
}

// Client -> host: throw an item / fire a bow, crossbow or musket.
//
// Source: Survivalcraft/Game/SubsystemThrowableBlockBehavior.cs:OnAim(Completed)
// Source: Survivalcraft/Game/SubsystemBowBlockBehavior.cs:OnAim(Completed)
// Source: Survivalcraft/Game/SubsystemCrossbowBlockBehavior.cs:OnAim(Completed)
// Source: Survivalcraft/Game/SubsystemMusketBlockBehavior.cs:OnAim(Completed)
message ProjectileFireRequest {
  int64 sequence = 1;
  // ProjectileFireKind.
  int32 kind = 2;
  // Held item value (contents + data) the client fired with.  The host requires
  // an exact match against its authoritative active slot.
  int32 item_value = 3;
  int32 active_slot = 4;
  // Client eye position (diagnostics; the host uses its own avatar eye).
  sump.position.Vec3 origin = 5;
  // Normalized aim direction.
  sump.position.Vec3 direction = 6;
  // Bow / crossbow draw (0..15) or musket hammer state (0/1); 0 for throwables.
  // Diagnostics / sanity range only: the host executes with its own
  // authoritative item data (draw, arrow type, load state).
  int32 charge = 7;
  // Requester's effective interaction reach (same semantics as PickableAcquireRequest.reach).
  optional float reach = 8;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// Host -> requester: verdict for one ProjectileFireRequest.
//
// The spawned projectiles are broadcast to every client through
// EntityState(ADD); this result only carries the requester's private sparse
// inventory delta (consumed item / durability / bow reset).
// spawned = 0 with accepted = true is a faithful engine outcome (blank musket
// shot, bow released without an arrow, crossbow not fully drawn): the host
// still performed the authoritative state transition, it just created no
// projectile.  A rejected request has spawned = 0 and never consumes anything.
message ProjectileFireResult {
  int64 sequence = 1;
  bool accepted = 2;
  string reason = 3;
  int32 kind = 4;
  int32 item_value = 5;
  // Number of authoritative projectiles created by the host engine.
  int32 spawned = 6;
  // First projectile's authoritative position / velocity (zero when spawned=0).
  sump.position.Vec3 position = 7;
  sump.position.Vec3 velocity = 8;
  repeated InventorySlotDelta inventory = 9;
  int32 inventory_version = 10;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// ---------------------------------------------------------------------------
// Weapon-fire presentation (host-relayed).
//
// The shooter client already plays its own local sound when it intercepts the
// engine's Completed branch.  The host executes the shot but its engine path
// does not play any sound, and other clients see the projectile appear in
// silence.  The host therefore relays this small presentation event after an
// accepted ProjectileFireRequest: the host plays it locally, every other
// client plays it at the shooter position, and the shooter skips its own echo
// (it already played the sound locally).
//
// Wire id lives in protocol.proto (append-only): WEAPON_FIRE_EVENT = 54.
// This message is presentation-only: receiving clients must never create a
// projectile, consume an item or deal damage because of it.
// ---------------------------------------------------------------------------
message WeaponFireEvent {
  // Host transport id of the shooter (0 = host itself).
  int32 client_id = 1;
  // Host simulation clock in milliseconds.
  int64 server_tick = 2;
  // Host session sequence, starts at 1, strictly increasing (clients dedupe).
  uint32 event_id = 3;
  // ProjectileFireKind (1..4).
  int32 kind = 4;
  // Host-authoritative shooter eye position (not the client's claim).
  sump.position.Vec3 position = 5;
  // Host-authoritative aim direction.
  sump.position.Vec3 direction = 6;
  // Musket misfire (water in barrel): sound is Audio/MusketMisfire, no shot.
  bool misfire = 7;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// ---------------------------------------------------------------------------
// Pickup sound presentation (host-relayed, append-only id 69).
//
// A client pickup is a request: the host executes the authoritative acquire and
// removes the pickable.  The engine's Audio/PickableCollected call lives in the
// host-side SubsystemPickables.Update, which never runs for the requesting
// client, so without this event the requester hears nothing at all.
//
// The host plays the sound locally (same parameters as the engine) and sends
// this tiny event to the requester (always) plus every other player within a
// small radius.  It is presentation-only: receiving clients must never grant
// the item, remove a pickable or alter terrain because of it.
// ---------------------------------------------------------------------------
message PickupSoundEvent {
  // Host transport id of the player whose pickup this is (> 0).
  int32 source_client_id = 1;
  // Host simulation clock in milliseconds.
  int64 server_tick_ms = 2;
  // Host session sequence, starts at 1, strictly increasing (clients dedupe/replay).
  uint32 event_id = 3;
  // Host-authoritative pickable position (the client's claimed position is never used).
  sump.position.Vec3 position = 4;
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}
