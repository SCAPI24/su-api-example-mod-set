syntax = "proto3";

package sump.uistate;

option csharp_namespace = "SuMultiplayer.Protocol.UiState";
option optimize_for = SPEED;

import "google/protobuf/any.proto";

// ---------------------------------------------------------------------------
// Client -> host: one snapshot of the client's **interface layer**.
//
// Why this message exists: the host's split-screen view of a client already
// follows that client's camera (auto client view / H3 replace mode; both bind
// GameWidget.Target to the client avatar's ComponentPlayer).  The view's HUD,
// however, is the *host's* HUD for that view's local player, so without this
// message the third view shows the host's input form / HUD / panels instead of
// the client's.
//
// What is carried (all engine facts, read-only on the client):
//   revision        monotonic per client session (>0); the host drops stale ones.
//   input_kind      UiInputKind below: touch / keyboard+mouse / gamepad, derived
//                   from the client's active GameWidget devices + the live
//                   ComponentInput.IsControlledByTouch switch.
//   hud_visible     engine HUD gate (ComponentGui.ControlsContainerWidget.IsVisible)
//                   AND the client's current screen is the game screen.
//   screen          ScreensManager.CurrentScreen class name ("GameScreen" = normal).
//   dialog_present  / dialog_type   engine dialog class parented to the client's GuiWidget.
//   modal_present   / modal_type    ComponentGui.ModalPanelWidget class name.
//   chat_input_open mod-owned chat HUD input line (informational; see the module docs
//                   for why a per-view clone is not instantiated).
//   small_messages  the client's visible MessageWidget entries (hint / pickup /
//                   level / crafting notes), oldest first, at most 3.
//   floating_message / overlay_message (+factors) ComponentScreenOverlays word /
//                   bottom hint line currently drawn by the client.
//   handcraft_*     the client's ComponentCraftingTable grid (FullInventoryWidget
//                   left half) so the host can recompute the same recipe result.
//
// Wire id lives in protocol.proto (MessageType.CLIENT_UI_STATE = 100).
// Append-only: never renumber.  Field numbers 10..17 are the phase-2 additions.
//
// Source: Survivalcraft/Game/ComponentGui.cs:395（ControlsContainerWidget.IsVisible）
// Source: Survivalcraft/Game/ComponentGui.cs:536-559（ModalPanelWidget = FullInventoryWidget /
//         CreativeInventoryWidget / ClothingWidget）
// Source: Survivalcraft/Game/ComponentInput.cs:30（IsControlledByTouch）
// Source: Survivalcraft/Game/DialogsManager.cs:50（ShowDialog：dialog parented to GuiWidget）
// Source: Survivalcraft/Game/ScreensManager.cs:46（CurrentScreen）
// Source: Survivalcraft/Game/GameWidget.cs:101-162（per-view WidgetInput.Devices）
// ---------------------------------------------------------------------------
message ClientUiState {
  // >0, monotonic per client session.  The host rejects revision <= last applied.
  uint32 revision = 1;

  // UiInputKind: 0 = unknown (never sent by this mod), 1 = touch,
  // 2 = keyboard + mouse, 3 = gamepad.
  uint32 input_kind = 2;

  // Engine HUD visible for the client's primary local player.
  bool hud_visible = 3;

  // Active engine screen class name.  1..64 chars from [A-Za-z0-9_.] only.
  string screen = 4;

  // An engine dialog is open, and its class name (e.g. "GameMenuDialog").
  // dialog_type must be empty when dialog_present = false.
  bool dialog_present = 5;
  string dialog_type = 6;

  // A modal panel is open, and its class name (e.g. "FullInventoryWidget",
  // "CreativeInventoryWidget", "ClothingWidget", "ChestWidget", "FurnaceWidget",
  // "CraftingTableWidget", "DispenserWidget").
  // modal_type must be empty when modal_present = false.
  bool modal_present = 7;
  string modal_type = 8;

  // The mod's chat HUD input line is open on the client.
  bool chat_input_open = 9;

  // -------------------------------------------------------------------------
  // Phase 2 (append-only): the three remaining HUD gaps of the H3 replace view.
  // Every field below is presentation-only data read from the client's engine
  // widgets; the host never writes it back into any component.
  // -------------------------------------------------------------------------

  // The client's currently visible "small messages" (hint / pickup / level /
  // crafting notes) as an ordered list, oldest first.  The engine keeps at most
  // 3 at a time and each dies on its own timer, so the host mirrors the *list*
  // rather than one edge: a message that is gone here must disappear there.
  // Source: Survivalcraft/Game/MessageWidget.cs:DisplayMessage / MaxMessages = 3
  // Source: Survivalcraft/Game/ComponentGui.cs:189-196（DisplaySmallMessage）
  repeated UiSmallMessage small_messages = 10;

  // ComponentScreenOverlays.FloatingMessage / Message + factors, i.e. the
  // camera-space "Zzz..." / "Aaa..." / "Ugh..." word and the bottom hint line.
  // Both are cleared to null/idle by ComponentScreenOverlays.Update (:60-77),
  // so the client reports the values it currently displays (empty = none).
  // Source: Survivalcraft/Game/ComponentScreenOverlays.cs:46-52,119
  string floating_message = 11;
  float floating_message_factor = 12;
  string overlay_message = 13;
  float overlay_message_factor = 14;

  // The client's **handcrafting grid** (FullInventoryWidget left half): the
  // ComponentCraftingTable the panel is bound to, minus the derived result slot
  // (slot SlotsCount-2) which the host recomputes from these ingredients.
  // Present only while the client's modal panel is FullInventoryWidget; absent
  // means "nothing to mirror" (never "empty grid").
  // Source: Survivalcraft/Game/FullInventoryWidget.cs（componentCraftingTable 绑定）
  // Source: Survivalcraft/Game/ComponentCraftingTable.cs:99-142（UpdateCraftingResult）
  bool handcraft_present = 15;
  repeated int32 handcraft_values = 16 [packed = true];
  repeated int32 handcraft_counts = 17 [packed = true];

  // Third-party extension points: see doc/message-protocol.md.
  bytes ext = 100;
  google.protobuf.Any custom = 101;
}

// One entry of the client's MessageWidget list (ScreenOverlays-style small text).
// `blinking` is the engine flag that decides the fade curve (6 s vs 4 s + newlines).
// Source: Survivalcraft/Game/MessageWidget.cs:Message(text, color, blinking)
message UiSmallMessage {
  string text = 1;
  // Engine Color packed value (ARGB uint32); the host writes the same Color.
  uint32 color = 2;
  bool blinking = 3;
  // Milliseconds since this entry started.  The engine fades / expires a message from
  // its own StartTime (MessageWidget.cs:Message.Update / RemoveOldMessages), so the
  // host offsets its copy by the same age and the two fade out together.
  uint32 age_ms = 4;
}
