<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivalcraft 联机模组 · 图解（架构 / 协议 / 流程 / 重写）</title>
<meta name="description" content="以图表为主的 ScMultiplayer 联机模组解析：架构、协议、交互流程、权威模型、扩展能力与重写映射，每个知识点带 GUID 标记。">
<style>
:root{
  --bg:#f4f7fc; --card:#ffffff; --tint:#f7f9fe; --tint2:#eef3fb;
  --line:#dde5f1; --line2:#c3d1e6;
  --tx:#16203a; --tx2:#48587a; --tx3:#7d8aa3;
  --cy:#0e7fa8; --cy2:#e4f5fc;
  --vi:#6a4bd8; --vi2:#efeafe;
  --am:#a9740a; --am2:#fff4df;
  --gr:#0d8a63; --gr2:#e5f8f0;
  --rd:#c23a55; --rd2:#fdecf0;
  --mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  --r:12px; --r2:9px;
  --sh:0 1px 2px rgba(20,40,80,.05),0 6px 18px rgba(20,40,80,.05);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--tx); font-family:var(--sans);
  font-size:14.5px; line-height:1.7; -webkit-font-smoothing:antialiased}
a{color:var(--cy); text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--mono); font-size:.87em; background:var(--tint2); border:1px solid var(--line);
  border-radius:5px; padding:.05em .34em; color:#1d3a63; white-space:nowrap}

.topbar{position:sticky; top:0; z-index:60; display:flex; align-items:center; gap:12px;
  padding:9px 20px; background:rgba(255,255,255,.9); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:10px; font-weight:750; white-space:nowrap; color:var(--tx)}
.brand .logo{width:28px; height:28px; border-radius:8px; display:grid; place-items:center; font-size:13px;
  background:linear-gradient(140deg,var(--cy),var(--gr)); color:#fff; font-weight:900}
.brand small{display:block; font-weight:500; font-size:11px; color:var(--tx3)}
.topbar .ver{font-family:var(--mono); font-size:11px; color:var(--tx2); border:1px solid var(--line);
  border-radius:999px; padding:2px 9px; background:var(--tint)}
.topbar .grow{flex:1}
.search{position:relative; min-width:180px}
.search input{width:100%; padding:7px 32px 7px 11px; border-radius:999px; font-family:var(--sans); font-size:12.5px;
  color:var(--tx); background:var(--tint); border:1px solid var(--line); outline:none}
.search input:focus{border-color:var(--cy); box-shadow:0 0 0 3px var(--cy2); background:#fff}
.search .hint{position:absolute; right:9px; top:50%; transform:translateY(-50%); font-family:var(--mono);
  font-size:10px; color:var(--tx3)}
.btn{cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--tx2); border-radius:999px;
  padding:6px 13px; font-size:12px; font-family:var(--sans); transition:.14s; white-space:nowrap}
.btn:hover{color:var(--tx); border-color:var(--line2); background:var(--tint)}
.progress{position:fixed; top:0; left:0; height:3px; width:0; z-index:70;
  background:linear-gradient(90deg,var(--cy),var(--gr),var(--am))}

.layout{display:grid; grid-template-columns:236px minmax(0,1fr); gap:26px;
  max-width:1460px; margin:0 auto; padding:0 22px 70px}
.sidebar{position:sticky; top:58px; align-self:start; max-height:calc(100vh - 76px); overflow-y:auto;
  padding:16px 4px 24px 0; font-size:12.5px}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line2); border-radius:6px}
.sidebar h4{margin:13px 0 5px; font-size:10.5px; letter-spacing:1.2px; color:var(--tx3); text-transform:uppercase}
.sidebar h4:first-child{margin-top:0}
.sidebar a{display:flex; gap:7px; padding:3.5px 8px; border-radius:7px; color:var(--tx2);
  border-left:2px solid transparent}
.sidebar a:hover{background:var(--tint); color:var(--tx); text-decoration:none}
.sidebar a.active{color:var(--tx); background:var(--cy2); border-left-color:var(--cy); font-weight:600}
.sidebar a .id{font-family:var(--mono); font-size:10px; color:var(--tx3); min-width:40px}
.sidebar a.active .id{color:var(--cy)}
main{min-width:0; padding-top:6px}

.hero{padding:34px 0 22px; border-bottom:1px solid var(--line); margin-bottom:10px}
.hero .kicker{display:inline-flex; align-items:center; gap:8px; font-family:var(--mono); font-size:11.5px;
  color:var(--cy); border:1px solid var(--line2); background:var(--cy2); padding:4px 12px; border-radius:999px}
.hero h1{margin:13px 0 9px; font-size:clamp(25px,3.4vw,38px); line-height:1.2; letter-spacing:-.4px; font-weight:800}
.hero h1 .g{background:linear-gradient(96deg,var(--cy),var(--vi) 52%,var(--am));
  -webkit-background-clip:text; background-clip:text; color:transparent}
.hero .lead{font-size:15px; color:var(--tx2); max-width:880px; margin:0 0 16px}
.hero .actions{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:18px}
.btn.pri{background:linear-gradient(120deg,var(--cy2),var(--gr2)); border-color:var(--line2);
  color:#0b3b52; font-weight:650}
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:11px 13px; box-shadow:var(--sh)}
.stat b{display:block; font-family:var(--mono); font-size:21px; color:var(--cy); line-height:1.2}
.stat span{display:block; font-size:11.5px; color:var(--tx3); margin-top:2px}

section.sec{margin:26px 0 8px; scroll-margin-top:68px}
.sec-head{display:flex; align-items:center; gap:11px; padding-bottom:9px; border-bottom:2px solid var(--line);
  margin-bottom:14px}
.sec-head .no{font-family:var(--mono); font-size:11px; font-weight:700; color:#fff; border-radius:7px;
  padding:4px 8px; background:linear-gradient(140deg,var(--cy),var(--gr))}
.sec-head h2{margin:0; font-size:clamp(18px,2vw,23px); font-weight:750; letter-spacing:-.2px}
.sec-head .sub{color:var(--tx3); font-size:12px; margin-left:auto; text-align:right}

.block{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px;
  margin:11px 0; scroll-margin-top:68px; box-shadow:var(--sh)}
.block.hidden,.sec.hidden{display:none}
.block-head{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:8px}
.block-head h3{margin:0; font-size:15.5px; font-weight:720}
.block-head .tagline{font-size:11.5px; color:var(--tx3)}
.guid{font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.4px; cursor:pointer;
  color:#fff; background:linear-gradient(140deg,var(--cy),var(--gr)); border:0; border-radius:6px;
  padding:2px 7px; transition:.14s; user-select:none}
.guid:hover{filter:brightness(1.1); box-shadow:0 2px 8px rgba(14,127,168,.3)}
.guid.copied{background:linear-gradient(140deg,var(--am),#e0a52a)}
.cap{margin:0 0 9px; color:var(--tx2); font-size:13px}
.notes{margin:8px 0 0; padding-left:18px; font-size:12.8px; color:var(--tx2)}
.notes li{margin:2.5px 0}
.notes li::marker{color:var(--cy)}
.small{font-size:12.3px}
.muted{color:var(--tx3)}

figure{margin:9px 0; border:1px solid var(--line); border-radius:var(--r2); padding:11px 11px 5px; background:var(--tint)}
figure svg{width:100%; height:auto; display:block}
figcaption{margin-top:5px; font-size:11.5px; color:var(--tx3); text-align:center}

.tw{overflow-x:auto; margin:8px 0; border:1px solid var(--line); border-radius:var(--r2)}
table{width:100%; border-collapse:collapse; font-size:12.6px; min-width:420px}
thead th{background:var(--tint2); text-align:left; padding:7px 10px; font-weight:700; color:#25344f;
  border-bottom:1px solid var(--line2); white-space:nowrap; font-size:12px}
tbody td{padding:6px 10px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:nth-child(even){background:var(--tint)}
tbody tr:last-child td{border-bottom:0}
td.mono,th.mono,.mono{font-family:var(--mono); font-size:11.8px}
td.gid,.gid{font-family:var(--mono); font-size:11.4px; color:var(--cy); font-weight:700; white-space:nowrap}
td.src,.src{font-family:var(--mono); font-size:11px; color:var(--tx3)}
.num{text-align:right; font-family:var(--mono)}

.grid{display:grid; gap:9px; margin:8px 0}
.g2{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(146px,1fr))}
.tile{background:var(--tint); border:1px solid var(--line); border-radius:var(--r2); padding:10px 11px}
.tile h5{margin:0 0 4px; font-size:13px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; color:#1d2b47}
.tile p{margin:2px 0; font-size:12.4px; color:var(--tx2)}
.tile .big{font-family:var(--mono); font-size:17px; color:var(--cy); display:block}
.dot{width:8px; height:8px; border-radius:50%; display:inline-block}

.callout{border-radius:var(--r2); padding:9px 12px; margin:9px 0; font-size:12.7px;
  border:1px solid var(--line); background:var(--tint); border-left:3px solid var(--cy); color:var(--tx2)}
.callout.warn{border-left-color:var(--am); background:var(--am2)}
.callout.ok{border-left-color:var(--gr); background:var(--gr2)}
.callout.bad{border-left-color:var(--rd); background:var(--rd2)}
.callout b{color:var(--tx)}
.callout .t{display:block; font-weight:700; margin-bottom:2px; color:var(--tx)}

.pills{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0}
.pill{font-size:11.5px; padding:3px 10px; border-radius:999px; border:1px solid var(--line);
  background:var(--tint); color:var(--tx2); font-family:var(--mono)}
.pill.cy{color:#0a5871; border-color:#bfe3f0; background:var(--cy2)}
.pill.gr{color:#0a6247; border-color:#c2e9d8; background:var(--gr2)}
.pill.am{color:#7d5606; border-color:#f0dcb0; background:var(--am2)}
.pill.vi{color:#4a30a8; border-color:#d6cbf7; background:var(--vi2)}
.pill.rd{color:#96243c; border-color:#f4cbd6; background:var(--rd2)}

.kv{display:grid; grid-template-columns:minmax(110px,180px) 1fr; border:1px solid var(--line);
  border-radius:var(--r2); overflow:hidden; margin:8px 0; font-size:12.6px}
.kv>dt{margin:0; padding:6px 11px; background:var(--tint2); font-weight:650; color:#25344f;
  border-bottom:1px solid var(--line)}
.kv>dd{margin:0; padding:6px 12px; border-bottom:1px solid var(--line); color:var(--tx2)}

.timeline{position:relative; margin:9px 0 4px; padding-left:22px}
.timeline::before{content:""; position:absolute; left:6px; top:5px; bottom:5px; width:2px; background:var(--line2)}
.tl{position:relative; margin:0 0 9px}
.tl::before{content:""; position:absolute; left:-20px; top:5px; width:10px; height:10px; border-radius:50%;
  background:#fff; border:2px solid var(--cy)}
.tl h5{margin:0 0 2px; font-size:13px; display:flex; gap:7px; align-items:center; flex-wrap:wrap}
.tl p{margin:0; font-size:12.5px; color:var(--tx2)}

.toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,14px); z-index:90; background:#101a2e;
  color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:.22s}
.toast.on{opacity:1; transform:translate(-50%,0)}
#nores{display:none; padding:22px; text-align:center; color:var(--tx3); border:1px dashed var(--line2);
  border-radius:var(--r); margin:14px 0; background:#fff}
.totop{position:fixed; right:20px; bottom:20px; z-index:80; width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center; cursor:pointer; opacity:0; pointer-events:none; transition:.2s;
  background:#fff; border:1px solid var(--line2); color:var(--cy); font-size:16px; box-shadow:var(--sh)}
.totop.on{opacity:1; pointer-events:auto}
footer{margin-top:28px; padding:18px 0 6px; border-top:1px solid var(--line); font-size:12px; color:var(--tx3)}
footer .row{display:flex; gap:14px; flex-wrap:wrap; justify-content:space-between}
noscript{display:block; padding:14px; background:var(--am2); border:1px solid #f0dcb0; border-radius:var(--r);
  font-size:12.5px; color:#5d4106; margin:14px 0}

.dgb{fill:#fff; stroke:#c3d1e6}
.dgb.host{fill:#e4f5fc; stroke:#2b9fc4}
.dgb.cli{fill:#efeafe; stroke:#7c5cf0}
.dgb.srv{fill:#e5f8f0; stroke:#17a273}
.dgb.warn{fill:#fff4df; stroke:#d99b12}
.dgb.rd{fill:#fdecf0; stroke:#d1495f}
.dgt{fill:#26314a; font-family:var(--mono); font-size:12px}
.dgt.sm{font-size:10.5px; fill:#5a6a86}
.dgl{stroke:#93a6c4; stroke-width:1.4; fill:none}
.dgl.cy{stroke:#2b9fc4} .dgl.vi{stroke:#7c5cf0} .dgl.am{stroke:#d99b12}
.dgl.gr{stroke:#17a273} .dgl.rd{stroke:#d1495f}
.dgl.dash{stroke-dasharray:5 4}
.dghead{fill:#101a2e; font-size:13px; font-weight:700; font-family:var(--sans)}

@media (max-width:1040px){
  .layout{grid-template-columns:1fr; gap:8px; padding:0 14px 60px}
  .sidebar{position:static; max-height:none; border-bottom:1px solid var(--line); padding-bottom:10px;
    display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:1px}
  .sidebar h4{grid-column:1/-1}
  .sec-head .sub{display:none}
}
@media print{
  body{background:#fff}
  .topbar,.sidebar,.totop,.progress,.toast{display:none!important}
  .layout{display:block; max-width:none; padding:0}
  .block,figure,.tile,.callout{break-inside:avoid; box-shadow:none}
  .sec{break-before:page}
}
</style>
</head>
<body>
<div class="progress" id="prog"></div>

<header class="topbar">
  <div class="brand">
    <div class="logo">MP</div>
    <div>联机模组图解<small>ScMultiplayer → SuMultiplayer</small></div>
  </div>
  <span class="ver">v2.2.9 / 协议 v1</span>
  <div class="grow"></div>
  <div class="search">
    <input id="q" type="search" placeholder="搜索内容或 GUID（例：FLW04）" autocomplete="off" spellcheck="false">
    <span class="hint">/</span>
  </div>
  <button class="btn" id="expand">摘要模式</button>
  <button class="btn" onclick="window.print()">打印 / PDF</button>
</header>

<div class="layout">
  <aside class="sidebar" id="toc"></aside>
  <main id="top">
    <section class="hero">
      <div class="kicker">● 图表为主 · 112 个 GUID 定位标记</div>
      <h1>联机模组：<span class="g">一张图看懂一个模块</span></h1>
      <p class="lead">
        每个知识点 = 一张图或一张表 + 一句说明。点击任意 <b>GUID</b> 可复制，用于移植时精确指代。
      </p>
      <div class="actions">
        <a class="btn pri" href="#OVR01">一页纸摘要</a>
        <a class="btn" href="chunk-region-sync.html">区块同步俯视图（另一页）</a>
        <a class="btn" href="#IDX01">GUID 索引</a>
      </div>
      <div class="stats" id="stats"></div>
    </section>
    <div id="nores">没有匹配的条目 —— 换个 GUID 或关键词试试</div>
    <div id="doc"></div>

    <footer>
      <div class="row">
        <div>联机模组图解 · 依据本仓库源码实测生成</div>
        <div>GUID：3 位域字母 + 2 位序号 · 共 112 个 · 参数与俯视图见 <a href="chunk-region-sync.html">chunk-region-sync.html</a></div>
      </div>
    </footer>
  </main>
</div>

<noscript>
  本页图表由脚本即时生成，请开启 JavaScript 查看。
  静态 GUID 清单（可直接在仓库内搜索同名标记）：OVR01–04、MOD01–16、NET01–11、PRT01–07、FLW01–19、
  AUT01–07、SYN01–06、DMX01–07、RGN01–06、SEC01–06、OPS01–07、RWT01–08、MAP01–03、IDX01–05。
</noscript>

<div class="toast" id="toast">已复制</div>
<div class="totop" id="totop" title="回到顶部">↑</div>

<script id="engine">
/* ==========================================================================
   图表引擎：内容以数据描述，统一渲染成 图 / 表 / 卡片，文字尽量短
   ========================================================================== */
(function () {
  "use strict";
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function h(html) {
    var d = document.createElement("div");
    d.innerHTML = String(html).trim();
    return d.firstElementChild;
  }
  function cell(v) {
    if (v === null || v === undefined) return "<td></td>";
    if (typeof v === "object") {
      if (v.g) return '<td class="gid">' + esc(v.g) + "</td>";
      if (v.m) return '<td class="mono">' + esc(v.m) + "</td>";
      if (v.s) return '<td class="src">' + esc(v.s) + "</td>";
      if (v.n) return '<td class="num">' + esc(v.n) + "</td>";
      return "<td>" + esc(v.t || "") + "</td>";
    }
    return "<td>" + esc(v) + "</td>";
  }
  function wrapFig(svg, cap) {
    return h('<figure><div class="figsvg">' + svg + "</div>" +
      (cap ? "<figcaption>" + esc(cap) + "</figcaption>" : "") + "</figure>");
  }

  function figCards(s) {
    var html = '<div class="grid g' + (s.cols || 3) + '">';
    (s.items || []).forEach(function (it) {
      html += '<div class="tile">';
      if (it.h) html += "<h5>" + (it.c ? '<span class="dot" style="color:' + it.c + ";background:" + it.c + '"></span>' : "") + esc(it.h) + "</h5>";
      if (it.big) html += '<span class="big">' + esc(it.big) + "</span>";
      if (it.p) html += "<p>" + it.p + "</p>";
      html += "</div>";
    });
    return h(html + "</div>");
  }

  function figTable(s) {
    var html = '<div class="tw"><table>';
    if (s.head) {
      html += "<thead><tr>";
      s.head.forEach(function (c, i) {
        html += "<th" + ((s.monoCols || []).indexOf(i) >= 0 ? ' class="mono"' : "") + ">" + esc(c) + "</th>";
      });
      html += "</tr></thead>";
    }
    html += "<tbody>";
    (s.rows || []).forEach(function (row) {
      html += "<tr>";
      row.forEach(function (c) { html += cell(c); });
      html += "</tr>";
    });
    return h(html + "</tbody></table></div>");
  }

  function figFlow(s) {
    var nodes = s.nodes || [], n = nodes.length;
    var W = 900, gap = 16, bw = (W - gap * (n - 1)) / n, bh = s.bh || 84;
    var top = s.title ? 30 : 12;
    var H = top + bh + (s.note ? 34 : 18);
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img">';
    if (s.title) out += '<text class="dghead" x="4" y="16">' + esc(s.title) + "</text>";
    nodes.forEach(function (nd, i) {
      var x = i * (bw + gap);
      out += '<rect class="dgb ' + (nd.c || "") + '" x="' + x + '" y="' + top + '" width="' + bw + '" height="' + bh + '" rx="10"/>';
      out += '<text class="dghead" x="' + (x + bw / 2) + '" y="' + (top + 24) + '" text-anchor="middle">' + esc(nd.t) + "</text>";
      (nd.s || []).forEach(function (line, k) {
        out += '<text class="dgt sm" x="' + (x + bw / 2) + '" y="' + (top + 44 + k * 16) + '" text-anchor="middle">' + esc(line) + "</text>";
      });
      if (i < n - 1) {
        var ax = x + bw, ay = top + bh / 2;
        out += '<path class="dgl ' + (s.arrow || "") + '" d="M' + ax + " " + ay + " L" + (ax + gap) + " " + ay + '"/>';
        out += '<path class="dgl ' + (s.arrow || "") + '" d="M' + (ax + gap - 6) + " " + (ay - 3) + " L" + (ax + gap) + " " + ay + " L" + (ax + gap - 6) + " " + (ay + 3) + '"/>';
      }
    });
    if (s.note) out += '<text class="dgt sm" x="4" y="' + (top + bh + 26) + '">' + esc(s.note) + "</text>";
    return wrapFig(out + "</svg>", s.cap);
  }

  function figSeq(s) {
    var lanes = s.lanes || [], steps = s.steps || [];
    var W = 900, pad = 20, laneW = (W - pad * 2) / lanes.length;
    var top = 46, stepH = 30, H = top + steps.length * stepH + 24;
    var out = '<svg viewBox="0 0 ' + W + " " + H + '" role="img">';
    var lc = s.laneClass || [];
    lanes.forEach(function (name, i) {
      var x = pad + laneW * i;
      out += '<rect class="dgb ' + (lc[i] || "") + '" x="' + x + '" y="10" width="' + (laneW - 14) + '" height="26" rx="7"/>';
